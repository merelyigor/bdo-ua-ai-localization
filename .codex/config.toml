# Бригада: звірка блоку правил і нагадування про делегування (skill brygada).
# Агент дописує цей фрагмент у <проєкт>/.codex/config.toml за розділом
# «Хуки проєкту» skill brygada; хук лише оновлює наявний блок.
[[hooks.SessionStart]]

[[hooks.SessionStart.hooks]]
type = "command"
command = 'f="$HOME/.codex/skills/brygada/scripts/brygada_hook.py"; if [ -f "$f" ]; then python3 "$f" --client codex; fi'
timeout = 10
statusMessage = "Бригада: звірка блоку правил"

# Формат звіту: звірка блоку правил (skill report-format).
# Агент дописує цей фрагмент у <проєкт>/.codex/config.toml за розділом
# «Хуки проєкту» skill report-format; хук лише оновлює наявний блок.
[[hooks.SessionStart]]

[[hooks.SessionStart.hooks]]
type = "command"
command = 'f="$HOME/.codex/skills/report-format/scripts/report_format_hook.py"; if [ -f "$f" ]; then python3 "$f" --client codex; fi'
timeout = 10
statusMessage = "Формат звіту: звірка блоку правил"
