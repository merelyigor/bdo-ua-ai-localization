# Незалежна перевірка набору.
#
# Навіщо. Рев'ю веде АРХІТЕКТОР із браузера: він має доступ ЛИШЕ до
# репозиторію й не може запустити ні тест, ні гейт, ні саботаж. Без цього
# прогону єдиним доказом лишається слово ВИКОНАВЦЯ, а саме так у наборі вже
# проїхав BLOCKER (повтори на «connection refused» коштували 570 секунд
# замість 0.7) і нестабільний тест D111, який падав раз із трьох.
#
# Секретів тут НЕМАЄ і не буде: селективний gate ключа не читає · він потрібен
# лише категорії `api` (`scripts/agent-check.sh`, `check_api`).
#
# ЗАБОРОНЕНО додавати `continue-on-error`, `|| true` чи будь-що, що ковтає код
# виходу. CI, який зеленіє легше за локальний гейт, гірший за відсутній: рев'юер
# спиратиметься на значок, за яким нічого немає.

name: gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  selective:
    name: ./bdo gate touched
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        # GitHub action input; JetBrains cannot resolve remote action metadata here.
        #noinspection UndefinedParamsPresent
        with:
          fetch-depth: 0

      # Версія прибита числом навмисно: мовчазне оновлення рантайму зробило б
      # CI нестабільним, а нестабільний CI починають ігнорувати.
      - name: PHP 8.5
        uses: shivammathur/setup-php@v2
        # GitHub action inputs; JetBrains cannot resolve remote action metadata here.
        #noinspection UndefinedParamsPresent
        with:
          php-version: '8.5'
          extensions: curl, json, mbstring, posix, pcntl
          coverage: none

      # Перелік зміряний: `scripts/agent-check.sh` вимагає git bash php jq curl
      # shellcheck perl, тести додають tmux і ripgrep.
      - name: Залежності runner
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends jq ripgrep tmux shellcheck desktop-file-utils
          for tool in git bash php jq curl shellcheck perl tmux rg desktop-file-validate node; do
            command -v "$tool" >/dev/null || { echo "немає $tool"; exit 1; }
          done
          bash --version | head -1
          php -v | head -1

      # ЛІНТЕР СТОРІНКИ СТАВИТЬСЯ ТУТ, А НЕ ПРОПУСКАЄТЬСЯ. Без нього
      # `tests/web-lint.sh` вийшов би кодом «не виконано», а пропуски в CI
      # заборонені · зелений прогін нічого не казав би про JavaScript.
      - name: Лінтер JavaScript
        run: npm ci --no-audit --no-fund

      - name: Теки прогону
        run: mkdir -p output state

      # Набір відмовляється працювати без файла цілі, і це правильно: інакше
      # прогін мовчки пішов би нікуди. На runner справжнього `.env` немає й бути
      # не може, тому підставляємо СИНТЕТИЧНИЙ · DEV на мертвий порт і ключ-
      # заглушку. Мережа з нього недосяжна за побудовою, тож жоден тест не
      # дотягнеться до живого API навіть помилково.
      - name: Синтетична ціль (DEV, мертвий порт)
        run: |
          set -euo pipefail
          printf '%s\n' \
            'BDO_ENV=DEV' \
            'BDO_API_TARGET=legacy' \
            'BDO_API_BASE_DEV=http://127.0.0.1:1' \
            'BDO_API_KEY_DEV=ci-not-a-real-key' > "$RUNNER_TEMP/bdo-ci.env"
          echo "TRANSLATE_ENV_FILE=$RUNNER_TEMP/bdo-ci.env" >> "$GITHUB_ENV"

      # Сервер сторінки · ядро продукту: саме він дає власнику GUI. Локальний
      # прогін на macOS цього не доводить, а `tests/web-server.sh` усередині
      # гейта ховає причину · він працює в теці `mktemp`, яку прибирає за
      # собою, тому на runner лишалось саме повідомлення без журналу сервера.
      # Крок піднімає сервер окремо й ДРУКУЄ його журнал, тому наступний
      # червоний прогін одразу називає причину, а не лише симптом.
      - name: Сервер сторінки піднімається (Linux)
        run: |
          # `-e` тут ВИМКНЕНО навмисно: крок GitHub запускає через
          # `bash -e`, і перший же невдалий запуск обірвав би крок ДО друку
          # журналу · рівно так перша версія цього кроку не показала нічого.
          # Код виходу не ковтається · він віддається в `exit "$code"` нижче.
          set +e
          set -uo pipefail
          tmp="$RUNNER_TEMP/web-start"
          mkdir -p "$tmp/state"
          BDO_STATE_DIR="$tmp/state" ./bdo web --background --no-open
          code=$?
          echo "код запуску: $code"
          echo "--- state/web.log ---"
          if [ -f "$tmp/state/web.log" ]; then cat "$tmp/state/web.log"; else echo "журналу немає"; fi
          if [ "$code" = 0 ]; then BDO_STATE_DIR="$tmp/state" ./bdo web --stop; fi
          exit "$code"

      # ПРОПУСКИ В CI ЗАБОРОНЕНІ. Тут усі інструменти встановлені й перевірені
      # кроком вище, тому «перевірку не виконано» означає поламане середовище,
      # а не особливість машини. Без цього зелений прогін CI не гарантував би
      # навіть того, що JavaScript сторінки колись запускався (аудит A-03).
      - name: Селективні перевірки точного diff
        env:
          BDO_GATE_NO_SKIP: '1'
          PUSH_BASE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base="$PUSH_BASE"
          if [ "${{ github.event_name }}" = pull_request ]; then base="$PR_BASE"; fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
            || ! git rev-parse --verify --quiet "${base}^{commit}" >/dev/null; then
            BDO_GATE_TOUCHED_ALL=1 ./bdo gate touched
          else
            BDO_GATE_TOUCHED_BASE="$base" ./bdo gate touched
          fi

  stability:
    name: cli-api-fetch × 5
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: PHP 8.5
        uses: shivammathur/setup-php@v2
        # GitHub action inputs; JetBrains cannot resolve remote action metadata here.
        #noinspection UndefinedParamsPresent
        with:
          php-version: '8.5'
          extensions: curl, json, mbstring, posix, pcntl
          coverage: none

      - name: Залежності runner
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends jq ripgrep tmux

      - name: Теки прогону
        run: mkdir -p output state

      # Набір відмовляється працювати без файла цілі, і це правильно: інакше
      # прогін мовчки пішов би нікуди. На runner справжнього `.env` немає й бути
      # не може, тому підставляємо СИНТЕТИЧНИЙ · DEV на мертвий порт і ключ-
      # заглушку. Мережа з нього недосяжна за побудовою, тож жоден тест не
      # дотягнеться до живого API навіть помилково.
      - name: Синтетична ціль (DEV, мертвий порт)
        run: |
          set -euo pipefail
          printf '%s\n' \
            'BDO_ENV=DEV' \
            'BDO_API_TARGET=legacy' \
            'BDO_API_BASE_DEV=http://127.0.0.1:1' \
            'BDO_API_KEY_DEV=ci-not-a-real-key' > "$RUNNER_TEMP/bdo-ci.env"
          echo "TRANSLATE_ENV_FILE=$RUNNER_TEMP/bdo-ci.env" >> "$GITHUB_ENV"

      # Один прогін цього класу дефектів не ловить: D111 падав раз із трьох, і
      # саме тому серія тут окремим завданням. Перший ненульовий код валить усе.
      - name: Пʼять прогонів підряд
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            echo "── прогін $i ──"
            bash tests/cli-api-fetch.sh
          done

  phpstan:
    name: PHPStan level 3
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: PHP 8.5
        uses: shivammathur/setup-php@v2
        # GitHub action inputs; JetBrains cannot resolve remote action metadata here.
        #noinspection UndefinedParamsPresent
        with:
          php-version: '8.5'
          tools: phpstan:2.2.13
          coverage: none

      # Межа памʼяті названа числом навмисно. Обсяг аналізу виріс із самої
      # теки `lib` до всього робочого шляху, а PHPStan рахує паралельними
      # процесами: на машині розробника дефолтні 128M саме через це впали з
      # «process crashed because it reached configured PHP memory limit», і
      # причина виглядала як поломка аналізу, а не як межа рантайму. Заміряний
      # пік · 51 MB, тож 1G це запас, а не потреба.
      - name: PHPStan level 3
        run: phpstan analyse -c phpstan.neon --no-progress --memory-limit=1G

  # МІНІМАЛЬНА ВЕРСІЯ · ЦЕ ОБІЦЯНКА, А НЕ ПОБАЖАННЯ. README вимагає PHP 8.3+,
  # а весь CI досі працював на 8.5: синтаксис або функція з 8.4 проїхали б
  # зеленими й зламались би вже в того, хто поставив заявлений мінімум.
  # Дублювати тут повний gate сенсу немає · досить довести, що код ЧИТАЄТЬСЯ і
  # ЗАПУСКАЄТЬСЯ на нижній межі.
  php_83_compat:
    name: PHP 8.3 (мінімальна заявлена)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: PHP 8.3
        uses: shivammathur/setup-php@v2
        # GitHub action inputs; JetBrains cannot resolve remote action metadata here.
        #noinspection UndefinedParamsPresent
        with:
          php-version: '8.3'
          extensions: curl, json, mbstring, posix, pcntl
          coverage: none

      - name: Синтаксис усього робочого PHP
        run: |
          set -euo pipefail
          count=0
          for file in $(git ls-files '*.php') bdo; do
            case "$file" in legacy/*) continue ;; esac
            php -l "$file" >/dev/null
            count=$((count + 1))
          done
          echo "php -l на 8.3: $count файлів"

      - name: Теки прогону
        run: mkdir -p output state

      - name: Синтетична ціль (DEV, мертвий порт)
        run: |
          set -euo pipefail
          printf '%s\n' \
            'BDO_ENV=DEV' \
            'BDO_API_TARGET=legacy' \
            'BDO_API_BASE_DEV=http://127.0.0.1:1' \
            'BDO_API_KEY_DEV=ci-not-a-real-key' > "$RUNNER_TEMP/bdo-ci.env"
          echo "TRANSLATE_ENV_FILE=$RUNNER_TEMP/bdo-ci.env" >> "$GITHUB_ENV"

      # Читабельність без запуску нічого не доводить: набір мусить СТАРТУВАТИ.
      # Беремо те, що не лізе ні в мережу, ні в Ollama, ні в GUI.
      - name: Набір стартує на 8.3
        run: |
          set -euo pipefail
          ./bdo help >/dev/null
          ./bdo env
          php tests/pipeline-unit.php
          php tests/pipeline-faults.php

  windows_native:
    name: Windows native PHP smoke
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: PHP 8.5
        uses: shivammathur/setup-php@v2
        # GitHub action inputs; JetBrains cannot resolve remote action metadata here.
        #noinspection UndefinedParamsPresent
        with:
          php-version: '8.5'
          coverage: none

      - name: Native PHP smoke
        run: pwsh -File tests/windows-native-smoke.ps1
