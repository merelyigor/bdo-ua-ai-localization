# Незалежна перевірка набору.
#
# Навіщо. Рев'ю веде АРХІТЕКТОР із браузера: він має доступ ЛИШЕ до
# репозиторію й не може запустити ні тест, ні гейт, ні саботаж. Без цього
# прогону єдиним доказом лишається слово ВИКОНАВЦЯ, а саме так у наборі вже
# проїхав BLOCKER (повтори на «connection refused» коштували 570 секунд
# замість 0.7) і нестабільний тест D111, який падав раз із трьох.
#
# Секретів тут НЕМАЄ і не буде: `./bdo gate full` ключа не читає · він потрібен
# лише категорії `api` (`scripts/agent-check.sh`, `check_api`).
#
# ЗАБОРОНЕНО додавати `continue-on-error`, `|| true` чи будь-що, що ковтає код
# виходу. CI, який зеленіє легше за локальний гейт, гірший за відсутній: рев'юер
# спиратиметься на значок, за яким нічого немає.

name: gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  full:
    name: ./bdo gate full
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Версія прибита числом навмисно: мовчазне оновлення рантайму зробило б
      # CI нестабільним, а нестабільний CI починають ігнорувати.
      - name: PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: curl, json, mbstring, posix, pcntl
          coverage: none

      # Перелік зміряний: `scripts/agent-check.sh` вимагає git bash php jq curl
      # shellcheck perl, тести додають tmux і ripgrep.
      - name: Залежності runner
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends jq ripgrep tmux shellcheck desktop-file-utils
          for tool in git bash php jq curl shellcheck perl tmux rg desktop-file-validate; do
            command -v "$tool" >/dev/null || { echo "немає $tool"; exit 1; }
          done
          bash --version | head -1
          php -v | head -1

      - name: Теки прогону
        run: mkdir -p output state

      # Набір відмовляється працювати без файла цілі, і це правильно: інакше
      # прогін мовчки пішов би нікуди. На runner справжнього `.env` немає й бути
      # не може, тому підставляємо СИНТЕТИЧНИЙ · DEV на мертвий порт і ключ-
      # заглушку. Мережа з нього недосяжна за побудовою, тож жоден тест не
      # дотягнеться до живого API навіть помилково.
      - name: Синтетична ціль (DEV, мертвий порт)
        run: |
          set -euo pipefail
          printf '%s\n' \
            'BDO_ENV=DEV' \
            'BDO_API_TARGET=legacy' \
            'BDO_API_BASE_DEV=http://127.0.0.1:1' \
            'BDO_API_KEY_DEV=ci-not-a-real-key' > "$RUNNER_TEMP/bdo-ci.env"
          echo "TRANSLATE_ENV_FILE=$RUNNER_TEMP/bdo-ci.env" >> "$GITHUB_ENV"

      # Сервер сторінки · ядро продукту: саме він дає власнику GUI. Локальний
      # прогін на macOS цього не доводить, а `tests/web-server.sh` усередині
      # гейта ховає причину · він працює в теці `mktemp`, яку прибирає за
      # собою, тому на runner лишалось саме повідомлення без журналу сервера.
      # Крок піднімає сервер окремо й ДРУКУЄ його журнал, тому наступний
      # червоний прогін одразу називає причину, а не лише симптом.
      - name: Сервер сторінки піднімається (Linux)
        run: |
          # `-e` тут ВИМКНЕНО навмисно: крок GitHub запускає через
          # `bash -e`, і перший же невдалий запуск обірвав би крок ДО друку
          # журналу · рівно так перша версія цього кроку не показала нічого.
          # Код виходу не ковтається · він віддається в `exit "$code"` нижче.
          set +e
          set -uo pipefail
          tmp="$RUNNER_TEMP/web-start"
          mkdir -p "$tmp/state"
          BDO_STATE_DIR="$tmp/state" ./bdo web --background --no-open
          code=$?
          echo "код запуску: $code"
          echo "--- state/web.log ---"
          if [ -f "$tmp/state/web.log" ]; then cat "$tmp/state/web.log"; else echo "журналу немає"; fi
          if [ "$code" = 0 ]; then BDO_STATE_DIR="$tmp/state" ./bdo web --stop; fi
          exit "$code"

      - name: gate full
        run: ./bdo gate full

  stability:
    name: cli-api-fetch × 5
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: curl, json, mbstring, posix, pcntl
          coverage: none

      - name: Залежності runner
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends jq ripgrep tmux

      - name: Теки прогону
        run: mkdir -p output state

      # Набір відмовляється працювати без файла цілі, і це правильно: інакше
      # прогін мовчки пішов би нікуди. На runner справжнього `.env` немає й бути
      # не може, тому підставляємо СИНТЕТИЧНИЙ · DEV на мертвий порт і ключ-
      # заглушку. Мережа з нього недосяжна за побудовою, тож жоден тест не
      # дотягнеться до живого API навіть помилково.
      - name: Синтетична ціль (DEV, мертвий порт)
        run: |
          set -euo pipefail
          printf '%s\n' \
            'BDO_ENV=DEV' \
            'BDO_API_TARGET=legacy' \
            'BDO_API_BASE_DEV=http://127.0.0.1:1' \
            'BDO_API_KEY_DEV=ci-not-a-real-key' > "$RUNNER_TEMP/bdo-ci.env"
          echo "TRANSLATE_ENV_FILE=$RUNNER_TEMP/bdo-ci.env" >> "$GITHUB_ENV"

      # Один прогін цього класу дефектів не ловить: D111 падав раз із трьох, і
      # саме тому серія тут окремим завданням. Перший ненульовий код валить усе.
      - name: Пʼять прогонів підряд
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            echo "── прогін $i ──"
            bash tests/cli-api-fetch.sh
          done

  phpstan:
    name: PHPStan level 0
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: phpstan:2.2.13
          coverage: none

      - name: PHPStan level 0
        run: phpstan analyse -c phpstan.neon --no-progress

  windows_native:
    name: Windows native PHP smoke
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Native PHP smoke
        run: pwsh -File tests/windows-native-smoke.ps1
