[project]
name = "bdo-ua-translate"
version = "1.50.13"
description = "Конвеєр перекладу Black Desert Online українською через BDO UA Translate Agent API: локальні моделі, ролі, механічні перевірки, запис у шар."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.15,<3",
  "jsonschema>=4.26,<5",
  "typer>=0.27,<1",
  "fastapi>=0.141,<1",
  "uvicorn>=0.54,<1",
  "jinja2>=3.1,<4",
  "sse-starlette>=3.4,<4",
  "python-multipart>=0.0.20,<1",
  "tenacity>=9.1,<10",
  "ollama>=0.6,<1",
  "openai>=3.19,<4",
  "sqlmodel>=0.0.47,<0.1",
  "regex>=2026.9",
  "truststore>=0.10.4",
  "json-repair>=0.63.5",
  "pymorphy3>=2.0.6",
  "pymorphy3-dicts-uk>=2.4.1.1.1663094765",
  "python-dotenv>=1.2.3",
]

[project.scripts]
bdo = "bdo_translate.cli:app"

[dependency-groups]
dev = [
  "ruff>=0.16,<1",
  "mypy>=2.3,<3",
  "types-regex>=2026.9.10.20260911",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bdo_translate"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src"]
[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "ASYNC", "S", "RUF"]
ignore = ["S101", "S603", "S607", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["bdo_translate"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["jsonschema.*", "sse_starlette.*"]
ignore_missing_imports = true
