<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>bdo · прогін</title>
<link rel="stylesheet" href="/app.css">
<!--
  ЕКРАН ПРОГОНУ · що робиться зараз.

  Екрани окремі (рішення власника 2026-09-05), тому цей файл містить лише те,
  що стосується прогону: шапка «куди пишемо / що зараз», стрічка кроків,
  підсумок, ролі та журнал кроків. Спільне (токен, навігація, живий стан,
  тримання хвоста) живе в `/app.js`.

  Дані беруться ЛИШЕ з `/api/*`. Жодного власного обліку: те, що показує це
  вікно, показує й термінал, бо джерело одне · файли `state/**`.
-->
</head>
<body>
<div class="wrap">
  <div class="nav" id="nav"></div>

  <div id="gate" class="panel" style="display:none"></div>

  <div id="app" style="display:none">
    <div class="screen-title">
      <h1>Прогін</h1>
      <span class="hint">крок за кроком: що робить кожна роль і що вже зроблено</span>
    </div>

    <!-- Шапка ОДНИМ рядком, як у прототипі 01: ціль, пачка, стан, час, дії.
         Два рядки з великими підписами «КУДИ ПИШЕМО / ЩО ЗАРАЗ» називали
         очевидне й відсували роботу ролей нижче згину екрана. -->
    <div class="panel">
      <div class="bar" style="margin-bottom:12px">
        <span class="pill" id="env">—</span>
        <span class="mono" id="batch" style="color:var(--ts)"></span>
        <span class="pill" id="statePhrase" style="background:var(--acc-bg);color:var(--acc-tx)">пачки немає</span>
        <span class="empty" id="elapsed" style="margin-left:auto"></span>
        <button id="stopBtn" style="color:var(--dn-tx)">зупинити</button>
        <a href="/start" style="font-size:13px;color:var(--acc-tx)">новий прогін →</a>
      </div>
      <div class="steps" id="steps"></div>
      <div class="empty" id="goal" style="margin-bottom:6px"></div>
      <div class="empty" id="meta"></div>
      <div class="empty" id="actionMsg" style="margin-top:6px"></div>
    </div>

    <div class="panel">
      <div class="bar" style="margin-bottom:8px">
        <span style="font-size:13px;font-weight:500">ролі й виклики моделі</span>
        <span class="empty" id="callsMeta"></span>
      </div>
      <div id="calls"></div>
    </div>

    <!-- ВЕРДИКТИ · рядки пачки з перекладом і думкою QA.
         Це те, заради чого сторінку й відкривають: до 2026-09-06 екран
         показував, скільки секунд працювала роль, але не показував ЖОДНОГО
         перекладеного рядка. Блок є в прототипі 01 від початку. -->
    <div class="panel" id="verdictPanel" style="display:none">
      <div class="bar" style="margin-bottom:8px">
        <span style="font-size:13px;font-weight:500">вердикти</span>
        <button class="chip" data-f="all" aria-pressed="true">усі</button>
        <button class="chip" data-f="pass">пройшло</button>
        <button class="chip" data-f="review">на перегляд</button>
        <button class="chip" data-f="reject">відхилено</button>
        <span class="empty" id="verdictMeta" style="margin-left:auto"></span>
      </div>
      <div id="verdicts"></div>
    </div>

    <!-- Підсумок ПІД роботою · у прототипі він унизу, і це правильний порядок:
         спершу видно, що зроблено, а вже потім скільки. -->
    <div class="cards" id="cards" style="margin-bottom:14px"></div>

    <div class="panel">
      <div class="bar" style="margin-bottom:8px">
        <span style="font-size:13px;font-weight:500">журнал кроків</span>
        <span class="empty">запит і відповідь кожної ролі · так само, як у терміналі</span>
        <button id="follow" style="margin-left:auto" aria-pressed="true">тримаюсь хвоста</button>
      </div>
      <pre class="log" id="log">журнал порожній</pre>
    </div>
  </div>
</div>

<script src="/app.js"></script>
<script>
(function () {
  'use strict';
  var B = window.BDO;
  B.renderNav('/');
  if (!B.ensureToken()) { return; }
  B.el('app').style.display = 'block';

  var lastCallsKey = '';
  var journal = B.follow(B.el('log'), B.el('follow'));

  // Живий друк іде через рівномірний буфер (`B.typer`), а не малюється порціями
  // так, як прилетіло: сервер читає журнал токенів тактами, тому за раз
  // приходить десяток символів, і без буфера друк смикає.
  var stream = B.typer(null, { onPaint: paintStream });
  // Сире СИРЕ тримаємо окремо: ролі відповідають під strict-схемою, тому модель
  // друкує JSON, і на екран іде лише те, що в ньому має сенс для людини
  // (`B.readable`). Без цього власник бачив `ext":"[Доса] Оберіть свій…` ·
  // переклад упереміш зі службовими лапками (виявлено на живому прогоні
  // 2026-09-06). Темп друку рахується вже по ЛЮДСЬКОМУ тексту.
  // ЩО РОБИТИ З ПОТОКОМ · знає `B.streamFeed`, а не екран: два джерела того
  // самого тексту (порції SSE і хвіст у знімку стану) вже сплутали одне одного
  // раз (D83), і другого місця з цим знанням бути не має.
  var feed = B.streamFeed(stream);

  // Пам'ять вікон: сервер тримає лише хвіст, тому початок роботи після
  // перезавантаження сторінки взяти нема звідки. Мітка · пачка (або сесія,
  // поки пачки немає): змінилась мітка, і старий запис зникає сам.
  var streamKeep = B.keep('run.stream');
  var journalKeep = B.keep('run.journal');
  B.keepPrune(['run.stream', 'run.journal']);
  var journalText = '';
  var journalTag = '';
  var journalLines = 0;   // скільки рядків журналу вже показано
  var streamTag = '';
  var rememberedAt = 0;

  // Запис у сховище · не частіше ніж раз на дві секунди: вікно може важити
  // сотні кілобайт, і писати їх на кожен знімок стану було б дорожче за саму
  // користь. Втратити при цьому можна щонайбільше останні дві секунди.
  function remember() {
    var now = Date.now();
    if (now - rememberedAt < 2000) { return; }
    rememberedAt = now;
    journalKeep.save(journalTag, journalText);
    streamKeep.save(streamTag, stream.text());
  }

  // Кожен крок має ПІДПИС станом. Сірий колір без слова змушував гадати, що
  // сталося з ремонтом · саме це власник і запитав 2026-09-05.
  var STEP_WORDS = {
    done: 'зроблено',
    now: 'іде зараз',
    skipped: 'не знадобився',
    pending: 'попереду'
  };

  // Малюємо ТЕКСТОМ, а не розміткою: `innerHTML` на кожен кадр змушував браузер
  // щоразу заново розбирати рядок, і саме це додавало ривків.
  //
  // Обрізання тут БУЛО і власник назвав його прямо 2026-09-06: показувалось
  // останні 4000 символів, тобто початок відповіді ролі зникав з очей назавжди
  // · сервер його вже не пам'ятає (знімок тримає лише хвіст журналу). Тепер
  // вікно показує ВСЮ відповідь, а межа лишається тільки як запобіжник від
  // нескінченного зростання вузла.
  function paintStream(text) {
    var box = B.el('streambox');
    if (!box) { return; }
    if (!text) { box.style.display = 'none'; return; }
    box.style.display = 'block';
    var body = box.firstChild;
    if (!body || body.nodeType !== 3) {
      box.textContent = '';
      body = document.createTextNode('');
      box.appendChild(body);
      var caret = document.createElement('span');
      caret.className = 'caret';
      box.appendChild(caret);
    }
    body.nodeValue = text;
    box.scrollTop = box.scrollHeight;
  }

  // Розгортання роботи виклику ПРЯМО в списку. Тягнемо лише на вимогу: відповідь
  // ролі це сотні кілобайт, і вантажити їх для кожного рядка списку означало б
  // мегабайти на кожну перемальовку.
  function bindOpenCall() {
    Array.prototype.forEach.call(B.el('calls').querySelectorAll('.openCall'), function (btn) {
      btn.onclick = function () {
        var card = btn.closest('.msg');
        var box = card.querySelector('.callWork');
        if (box.style.display !== 'none') {
          box.style.display = 'none';
          btn.textContent = 'розгорнути роботу';
          return;
        }
        box.style.display = 'block';
        btn.textContent = 'згорнути';
        if (box.dataset.loaded === '1') { return; }
        box.innerHTML = B.loadingHtml('беру роботу ролі з диска…');
        B.get('/api/call?' + card.dataset.call).then(function (d) {
          if (d.error) {
            box.innerHTML = '<div class="empty">' + B.esc(d.hint || 'виклик не знайдено') + '</div>';
            return;
          }
          box.dataset.loaded = '1';
          box.innerHTML = part('що пішло в модель', d.payload) + part('що модель відповіла', d.answer);
        }).catch(function () {
          box.innerHTML = '<div class="empty">сервер не відповів</div>';
        });
      };
    });
  }

  function part(title, work) {
    if (!work) {
      return '<div class="empty" style="margin-top:6px">' + B.esc(title)
        + ' · файла немає (пачку прибрано або відповіді не було)</div>';
    }
    var kb = work.size < 1024 ? work.size + ' Б' : Math.round(work.size / 1024) + ' КБ';
    return '<div class="empty" style="margin-top:8px">' + B.esc(title) + ' · '
      + B.esc(work.path) + ' · ' + kb + (work.truncated ? ' · показано перші 2 МБ' : '') + '</div>'
      + '<pre class="log">' + B.esc(work.text) + '</pre>';
  }

  // Фільтр вердиктів живе поза `render`: перемальовка знімка не має скидати
  // вибір власника. Саме так поводиться прототип.
  // Фільтр вердиктів переживає перезавантаження: власник дивиться «на перегляд»
  // пачку за пачкою, і скидати вибір на кожному відкритті означало б клікати
  // його щоразу.
  var VP = B.pref('run');
  var verdictFilter = String(VP.get('verdictFilter', 'all'));
  var lastVerdictKey = '';

  function renderVerdicts(v) {
    var items = v.items || [];
    var panel = B.el('verdictPanel');
    if (!items.length) { panel.style.display = 'none'; return; }
    panel.style.display = 'block';

    // Перемальовуємо лише коли зміст СПРАВДІ змінився: інакше кожен знімок
    // стану переписував би десятки вузлів раз на секунду без причини.
    var key = v.total + '|' + v.pass + '|' + v.review + '|' + v.reject + '|' + items.length;
    if (key !== lastVerdictKey) {
      lastVerdictKey = key;
      // Кнопка збереженого фільтра мусить виглядати натиснутою, інакше показ
      // і підпис розійдуться.
      Array.prototype.forEach.call(document.querySelectorAll('#verdictPanel .chip'), function (c) {
        c.setAttribute('aria-pressed', c.dataset.f === verdictFilter ? 'true' : 'false');
      });
      B.el('verdicts').innerHTML = items.map(function (r) {
        // Клас, а не зібране рядком імʼя змінної: `var(--' + color + '-bg)`
        // не бачить ні редактор, ні інспекція · вони мають рацію, бо таку
        // назву неможливо перевірити.
        var kind = r.kind || 'none';
        return '<div class="vrow" data-v="' + B.esc(kind) + '">'
          + '<span class="pill v-' + B.esc(kind) + '">' + B.esc(r.label) + '</span>'
          + '<div style="flex:1;min-width:0">'
          + '<div class="mono" style="color:var(--tm)">' + B.esc(r.source) + '</div>'
          + (r.text ? '<div class="mono">' + B.esc(r.text) + '</div>'
                    : '<div class="empty">перекладу ще немає</div>')
          + (r.issue ? '<div class="vissue" title="натисни, щоб розгорнути">'
              + B.esc(r.issue) + '</div>' : '')
          + '</div></div>';
      }).join('');
      applyVerdictFilter();
      // Довгий вирок розгортається кліком по ньому самому · окрема кнопка на
      // кожен рядок була б шумом там, де таких рядків десятки.
      Array.prototype.forEach.call(B.el('verdicts').querySelectorAll('.vissue'), function (n) {
        n.onclick = function () { n.classList.toggle('open'); };
      });
    }
    var meta = [B.num(v.total) + ' з вироком'];
    if (items.length < v.total) { meta.push('показано ' + items.length); }
    B.el('verdictMeta').textContent = meta.join(' · ');
    setChip('all', v.total);
    setChip('pass', v.pass);
    setChip('review', v.review);
    setChip('reject', v.reject);
  }

  function setChip(name, count) {
    var btn = B.el('verdictPanel').querySelector('.chip[data-f="' + name + '"]');
    if (!btn) { return; }
    var words = { all: 'усі', pass: 'пройшло', review: 'на перегляд', reject: 'відхилено' };
    btn.textContent = words[name] + ' ' + B.num(count || 0);
    // Порожню категорію ховаємо: кнопка «відхилено 0» пропонує подивитись на
    // те, чого немає.
    btn.style.display = (name === 'all' || count) ? '' : 'none';
  }

  function applyVerdictFilter() {
    Array.prototype.forEach.call(B.el('verdicts').querySelectorAll('.vrow'), function (r) {
      r.style.display = (verdictFilter === 'all' || r.dataset.v === verdictFilter) ? 'flex' : 'none';
    });
  }

  Array.prototype.forEach.call(document.querySelectorAll('#verdictPanel .chip'), function (c) {
    c.onclick = function () {
      Array.prototype.forEach.call(document.querySelectorAll('#verdictPanel .chip'), function (o) {
        o.setAttribute('aria-pressed', 'false');
      });
      c.setAttribute('aria-pressed', 'true');
      verdictFilter = c.dataset.f;
      VP.set('verdictFilter', verdictFilter);
      applyVerdictFilter();
      // Довгий вирок розгортається кліком по ньому самому · окрема кнопка на
      // кожен рядок була б шумом там, де таких рядків десятки.
      Array.prototype.forEach.call(B.el('verdicts').querySelectorAll('.vissue'), function (n) {
        n.onclick = function () { n.classList.toggle('open'); };
      });
    };
  });

  function render(s) {
    var target = (s.env || '').toUpperCase() || '—';
    var envEl = B.el('env');
    envEl.textContent = target;
    envEl.style.background = target === 'PROD' ? 'var(--dn-bg)' : 'var(--s2)';
    envEl.style.color = target === 'PROD' ? 'var(--dn-tx)' : 'var(--ts)';

    var b = s.batch || {};
    if (b.id) {
      var bits = [b.id];
      if (b.patch) { bits.push(b.patch === 'active' ? 'активний патч' : 'патч ' + b.patch); }
      bits.push(B.num(b.rows) + ' рядків');
      if (b.domain) { bits.push(b.domain); }
      B.el('batch').textContent = bits.join(' · ');
      B.el('statePhrase').textContent = b.state_phrase || b.state_label || '—';
    } else {
      B.el('batch').textContent = '';
      B.el('statePhrase').textContent = 'пачки немає';
    }
    // Скільки триває прогін · у прототипі це `3:41` у правому куті шапки.
    // Показуємо ЛИШЕ поки він іде: `run-target` живе й після завершення, і
    // лічильник, що біжить над зупиненим прогоном, каже неправду.
    B.el('elapsed').textContent = (s.running && s.run && s.run.elapsed) ? s.run.elapsed : '';
    var goal = B.el('goal');
    goal.textContent = (s.goal && s.goal.phrase) ? s.goal.phrase : 'ціль прогону не зафіксована';
    // Сам запит до API лишається в підказці: він потрібен при розборі, але на
    // екрані власника мусить стояти те, що робиться, а не як відібрано рядки.
    goal.title = (s.goal && s.goal.query) ? 'вибірка: ' + s.goal.query : '';

    // Хлібний слід: стан каже КОЛІР, а слово лишається в підказці · шість
    // однакових «зроблено» під кроками не додавали нічого, крім висоти.
    B.el('steps').innerHTML = (s.steps || []).map(function (st, i) {
      var state = st.state || 'pending';
      return (i ? '<span class="arrow">›</span>' : '')
        + '<span class="step ' + state + '" title="' + B.esc(STEP_WORDS[state] || state) + '">'
        + '<span class="n">' + B.esc(st.label) + '</span></span>';
    }).join('');

    var sum = s.summary || {};
    var callsView = s.calls || { scope: 'session', items: [] };
    var calls = callsView.items || [];
    var cards = [
      ['у шар', sum.to_layer, 'var(--ok-tx)'],
      ['до людини', sum.to_human, ''],
      ['карантин', sum.quarantine, (sum.quarantine ? 'var(--dn-tx)' : '')],
      ['викликів моделі', calls.length, '']
    ];
    B.el('cards').innerHTML = cards.map(function (c) {
      var v = (c[1] === undefined || c[1] === null) ? '—' : B.num(c[1]);
      return '<div class="card"><div class="l">' + B.esc(c[0]) + '</div>'
        + '<div class="v"' + (c[2] ? ' style="color:' + c[2] + '"' : '') + '>' + v + '</div></div>';
    }).join('');

    var meta = [];
    meta.push(s.running ? 'прогін іде' : 'прогін не йде');
    if (b.updated_ago) { meta.push('останній рух ' + b.updated_ago); }
    if (s.session && s.session.id) { meta.push('сесія ' + s.session.id + ' · пачок ' + B.num(s.session.batches)); }
    if (s.remaining !== null && s.remaining !== undefined) { meta.push('лишилось рядків ' + B.num(s.remaining)); }
    B.el('meta').textContent = meta.join(' | ');
    B.el('stopBtn').disabled = !s.running;

    var key = calls.map(function (c) { return c.at + c.role + c.verdict + c.ms; }).join('|');
    var live = (s.stream && s.stream.role_label && s.stream.fresh) ? s.stream.role_label : '';
    if (key !== lastCallsKey || (live && !B.el('streambox'))) {
      lastCallsKey = key;
      var html = calls.length ? calls.map(function (c) {
        var okColor = c.verdict === 'ok' ? 'var(--ok-tx)' : 'var(--dn-tx)';
        var bits = [];
        // Скільки рядків пішло в модель · без цього «53 с» не має знаменника:
        // незрозуміло, це один важкий рядок чи десять легких.
        // Одиницю називає СЕРВЕР: термінолог рахує терміни, а не рядки пачки, і
        // «136 рядків» на пачці з 50 рядків читалось як помилка.
        if (c.rows) { bits.push(B.num(c.rows) + ' ' + (c.unit || 'рядків')); }
        if (c.in || c.out) { bits.push(B.num(c.in) + '→' + B.num(c.out) + ' ток.'); }
        // Вага самого payload · це «навантаження JSON», яке готує рушій.
        // Токени рахуються ПІСЛЯ підміни хешів на короткі ключі, тому два
        // числа поруч показують, скільки важать службові поля.
        if (c.payload_bytes) { bits.push(Math.round(c.payload_bytes / 1024) + ' КБ payload'); }
        if (c.ms) { bits.push(B.secs(c.ms)); }
        if (c.think) { bits.push('роздуми'); }
        // РОБОТУ ЗАВЕРШЕНОГО ВИКЛИКУ можна відкрити · власник попросив бачити
        // її після закінчення ролі, а не тільки поки друкується (2026-09-06).
        // Ключ виклику · час і роль, той самий, що приймає `/api/call`.
        var key2 = 'at=' + encodeURIComponent(c.at) + '&role=' + encodeURIComponent(c.role);
        return '<div class="msg" data-call="' + B.esc(key2) + '"><div class="mh">'
          + '<span style="font-weight:500">' + B.esc(c.role_label) + '</span>'
          + '<span class="meta">' + B.esc(bits.join(' · ')) + '</span>'
          + '<span style="margin-left:auto;font-size:12px;color:' + okColor + '">' + B.esc(c.verdict || '—') + '</span>'
          + '<span class="meta" style="margin-left:8px">' + B.esc(c.hms) + '</span></div>'
          + '<div class="bar" style="margin-top:6px">'
          + '<button class="openCall" type="button">розгорнути роботу</button>'
          + '<a href="/call?' + B.esc(key2) + '" target="_blank" rel="noopener"'
          + ' style="font-size:12px;color:var(--acc-tx)">на весь екран ↗</a></div>'
          + '<div class="callWork" style="display:none"></div></div>';
      }).join('') : '<div class="empty">' + B.esc(callsView.reason || 'викликів немає') + '</div>';
      // Роль, яка друкує ЗАРАЗ, ще не має рядка в журналі викликів: він
      // пишеться ПІСЛЯ відповіді. Тому її картка малюється окремо.
      if (live && s.running) {
        // ЩО САМЕ ЗАРАЗ · «друкує…» лише коли справді йдуть символи.
        //
        // Ollama вивантажує вагу за налаштуванням машини (у власника 5 хвилин),
        // і перший виклик після паузи спершу вантажить 23 ГБ. На живому прогоні
        // це дало 960 секунд повного мовчання · виглядало як «зависло».
        var waiting = (s.stream && s.stream.waiting) || 0;
        var loading = waiting >= 12;
        html += '<div class="msg active"><div class="mh">'
          + '<span style="font-weight:500;color:var(--acc-tx)">' + B.esc(live) + '</span>'
          + '<span class="meta">' + (loading
              ? 'модель вантажиться, ' + waiting + ' с · перший виклик після паузи тягне вагу з диска'
              : 'друкує…') + '</span></div>'
          + (loading
              ? '<div class="empty" style="margin-top:6px">Це не зависання: Ollama вивантажує модель за своїм '
                + 'налаштуванням, і наступні виклики підуть без цієї паузи.</div>'
              : '')
          + '<div class="box mono" id="streambox"></div></div>';
      }
      B.el('calls').innerHTML = html;
      bindOpenCall();
      B.el('callsMeta').textContent = !calls.length ? ''
        : (callsView.scope === 'batch'
            ? 'пачки ' + callsView.batch + ' · ' + calls.length
            : 'цієї сесії · ' + calls.length + ' (пачку не вказано)');
      paintStream(stream.text());
    }

    // Знімок стану знає лише ХВІСТ журналу токенів (`s.stream.complete` каже,
    // чи це початок відповіді). Тому його текст ЗШИВАЄТЬСЯ з накопиченим по
    // збігу, а не підміняє його: підміна не впізнавала префікса й щосекунди
    // починала друк спочатку · саме це власник бачив як друк «порціями по
    // рядку» 2026-09-06 (D83).
    renderVerdicts(s.verdicts || {});
    feed.snapshot(s.stream);
    // Роль договорила · тягнути залишок буфера нема сенсу.
    if (!live || !s.running) { stream.flush(); }

    // Журнал кроків сервер теж віддає ХВОСТОМ (200 рядків), тому початок пачки
    // зникав з екрана. Накопичуємо його тим самим зшиванням і тримаємо в
    // пам'яті вікна · перезавантаження сторінки більше не з'їдає початок.
    var tag = String(b.id || (s.session && s.session.id) || '');
    if (tag !== journalTag) {
      // Нова мітка · беремо збережене саме під неї. Немає такого запису ·
      // `load` віддає порожньо, і вікно просто починається з чистого аркуша.
      journalTag = tag;
      journalText = journalKeep.load(tag);
      journalLines = journalText === '' ? 0 : journalText.split('\n').length;
    }
    // Журнал сервер віддає ХВОСТОМ у 200 рядків і НАЗИВАЄ номер першого з них
    // (`transcript_from`). Тому дописуємо рівно ті рядки, яких ще не бачили ·
    // без жодного зіставлення тексту. Зшивання по вмісту тут уже вигадувало
    // слова, яких модель не друкувала (D83), і повертати його не можна.
    var lines = s.transcript || [];
    var from = s.transcript_from;
    if (from === -1 || from === undefined || from > journalLines) {
      // Порахувати межу не вийшло або ми відстали більше, ніж сервер пам'ятає:
      // показуємо хвіст як є. Це видно розривом · і це чесно.
      journalText = lines.join('\n');
      journalLines = from === -1 || from === undefined ? lines.length : from + lines.length;
    } else {
      var fresh = lines.slice(journalLines - from);
      if (fresh.length) {
        journalText = journalText === '' ? fresh.join('\n') : journalText + '\n' + fresh.join('\n');
        journalLines += fresh.length;
      }
    }
    journal.write(journalText || 'журнал порожній');

    // Мітка живого друку · пачка ПЛЮС роль: у межах пачки ролі змінюють одна
    // одну, і відповідь термінолога не має відновитись у вікні перекладача.
    var sTag = tag + '/' + String((s.stream && s.stream.role) || '');
    if (sTag !== streamTag) {
      streamTag = sTag;
      var saved = streamKeep.load(sTag);
      if (saved && stream.text() === '') { stream.sync(saved); stream.flush(); }
    }
    remember();
  }

  B.live(render, function (d) { feed.delta(d); });

  B.el('stopBtn').onclick = function () {
    var msg = B.el('actionMsg');
    msg.textContent = 'зупиняю…';
    B.post('/api/action', { action: 'run.stop' }).then(function (res) {
      msg.textContent = res.status >= 400
        ? (res.body && res.body.hint ? res.body.hint : 'відмова, код ' + res.status)
        : 'прогін зупинено';
      msg.style.color = res.status >= 400 ? 'var(--dn-tx)' : 'var(--ok-tx)';
    });
  };
})();
</script>
</body>
</html>
