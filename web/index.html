<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>bdo · прогін</title>
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="stylesheet" href="/app.css">
<!--
  ЕКРАН ПРОГОНУ · що робиться зараз.

  Екрани окремі (рішення власника 2026-09-05), тому цей файл містить лише те,
  що стосується прогону: шапка «куди пишемо / що зараз», стрічка кроків,
  підсумок, ролі та журнал кроків. Спільне (токен, навігація, живий стан,
  тримання хвоста) живе в `/app.js`.

  Дані беруться ЛИШЕ з `/api/*`. Жодного власного обліку: те, що показує це
  вікно, показує й термінал, бо джерело одне · файли `state/**`.
-->
</head>
<body>
<div class="wrap">
  <div class="nav" id="nav"></div>

  <div id="gate" class="panel" style="display:none"></div>

  <div id="app" style="display:none">
    <div class="screen-title">
      <h1>Прогін</h1>
      <span class="hint">крок за кроком: що робить кожна роль і що вже зроблено</span>
    </div>

    <!-- Шапка ОДНИМ рядком, як у прототипі 01: ціль, пачка, стан, час, дії.
         Два рядки з великими підписами «КУДИ ПИШЕМО / ЩО ЗАРАЗ» називали
         очевидне й відсували роботу ролей нижче згину екрана. -->
    <div class="panel hero" id="runHero">
      <div class="bar" style="margin-bottom:12px">
        <span class="pill" id="env">—</span>
        <span class="mono" id="batch" style="color:var(--ts)"></span>
        <span class="pill" id="statePhrase" style="background:var(--acc-bg);color:var(--acc-tx)" aria-live="polite">пачки немає</span>
        <span class="empty" id="elapsed" style="margin-left:auto"></span>
        <!-- ПАУЗА ПОРУЧ ЗІ СТОПОМ · як у макеті 01. Різниця між ними не
             косметична: «зупинити» вбиває сесію разом із живим викликом ролі,
             а пауза дає крокові дописати результат і виходить між ролями. -->
        <button id="pauseBtn" type="button">пауза</button>
        <button id="stopBtn" class="btn-danger">зупинити</button>
        <!-- ПРОДОВЖИТИ · дія прямо тут, а не перехід на форму: власник
             натиснув «продовжити пачку» й опинився на виборі режиму, де вибір
             усе одно був би проігнорований (D101). Кнопка й посилання стоять
             поруч і показуються по одному. -->
        <button id="continueBtn" class="btn-primary" type="button" style="display:none">продовжити пачку</button>
        <a href="/start" id="startLink" class="as-button">новий прогін →</a>
      </div>
      <div class="steps" id="steps"></div>
      <div class="progress" id="batchProgressWrap" style="display:none" title=""><div class="progress-bar" id="batchProgress"></div></div>
      <div class="empty" id="goal" style="margin-bottom:6px"></div>
      <div class="empty" id="meta"></div>
      <div class="empty" id="actionMsg" style="margin-top:6px"></div>
    </div>

    <div class="panel">
      <div class="bar" style="margin-bottom:8px">
        <span style="font-size:13px;font-weight:500">ролі й виклики моделі</span>
        <span class="empty" id="callsMeta"></span>
      </div>
      <div id="calls"></div>
    </div>

    <!-- ВЕРДИКТИ · рядки пачки з перекладом і думкою QA.
         Це те, заради чого сторінку й відкривають: до 2026-09-06 екран
         показував, скільки секунд працювала роль, але не показував ЖОДНОГО
         перекладеного рядка. Блок є в прототипі 01 від початку. -->
    <div class="panel" id="verdictPanel" style="display:none">
      <!-- ЗГОРНУТО ЗА ЗАМОВЧУВАННЯМ (вимога власника 2026-09-18). Розгорнутий
           список із пʼятдесяти рядків розтягував сторінку прогону на сім тисяч
           пікселів, і журнал кроків опинявся десь далеко внизу. Власник читає
           вироки всі, тому список нікуди не дівся · він за одним кліком, а в
           згорнутому вигляді видно головні числа з підписами.
           `<details>` навмисно: стан «розгорнуто» тримає сам браузер, і
           перемальовка знімка раз на секунду його не скидає, бо ми переписуємо
           лише вміст `#verdicts` і числа в підсумку. -->
      <details class="verdict-box" id="verdictBox">
      <summary class="verdict-summary">
        <!-- Стрілка · та сама іконка, що й решта інтерфейсу, і РОЗМІРОМ з
             елемент керування: символ «▸» у 11 пікселів власник просто не
             бачив (2026-09-18). Малюється скриптом, бо набір іконок один. -->
        <span class="verdict-caret" id="verdictCaret"></span>
        <span class="verdict-title">вердикти</span>
        <span class="verdict-counts" id="verdictCounts"></span>
      </summary>
      <div class="bar" style="margin-bottom:8px">
        <button class="chip" data-f="all" aria-pressed="true">усі</button>
        <button class="chip" data-f="pass">пройшло</button>
        <button class="chip" data-f="review">на перегляд</button>
        <button class="chip" data-f="reject">відхилено</button>
        <input type="search" class="search" id="verdictSearch" placeholder="пошук: слово з перекладу…" aria-label="пошук у вердиктах">
        <span class="empty" id="verdictMeta" style="margin-left:auto"></span>
      </div>
      <div id="verdicts"></div>
      </details>
    </div>

    <!-- Підсумок ПІД роботою · у прототипі він унизу, і це правильний порядок:
         спершу видно, що зроблено, а вже потім скільки. -->
    <div class="cards" id="cards" style="margin-bottom:14px"></div>

    <details class="panel journal-panel">
      <summary class="journal-summary">
        <span class="journal-caret" id="journalCaret"></span>
        <span class="journal-title">журнал кроків</span>
        <span class="empty">запит і відповідь кожної ролі · так само, як у терміналі</span>
      </summary>
      <div class="journal-toolbar">
        <button id="follow" aria-pressed="true">тримаюсь хвоста</button>
      </div>
      <pre class="log journal-log" id="log">журнал порожній</pre>
    </details>
  </div>
</div>

<script src="/app.js"></script>
<script>
(function () {
  'use strict';
  var B = window.BDO;
  B.renderNav('/');
  // Стрілку згортання малюємо один раз: вона не залежить від даних.
  B.el('verdictCaret').innerHTML = B.icon('chevron');
  B.el('journalCaret').innerHTML = B.icon('chevron');
  if (!B.ensureToken()) { return; }
  B.el('app').style.display = 'block';

  var lastCallsKey = '';
  var lastStepsKey = '';
  var lastNavStepsKey = '';
  var lastCardsKey = '';
  // Настройка роздумів · факт із знімка, а не здогад екрана. Потрібна
  // `paintThinking`, який малюється частіше за картку виклику.
  var thinkSetting = null;
  var journal = B.follow(B.el('log'), B.el('follow'));

  // Живий друк іде через рівномірний буфер (`B.typer`), а не малюється порціями
  // так, як прилетіло: сервер читає журнал токенів тактами, тому за раз
  // приходить десяток символів, і без буфера друк смикає.
  var stream = B.typer(null, { onPaint: paintStream });
  // Сире СИРЕ тримаємо окремо: ролі відповідають під strict-схемою, тому модель
  // друкує JSON, і на екран іде лише те, що в ньому має сенс для людини
  // (`B.readable`). Без цього власник бачив `ext":"[Доса] Оберіть свій…` ·
  // переклад упереміш зі службовими лапками (виявлено на живому прогоні
  // 2026-09-06). Темп друку рахується вже по ЛЮДСЬКОМУ тексту.
  // ЩО РОБИТИ З ПОТОКОМ · знає `B.streamFeed`, а не екран: два джерела того
  // самого тексту (порції SSE і хвіст у знімку стану) вже сплутали одне одного
  // раз (D83), і другого місця з цим знанням бути не має.
  // РОЗДУМИ · власна друкарка й власне вікно, як у прототипі 01: там роздуми
  // стоять НАД відповіддю окремим приглушеним блоком, а чип «роздуми» його
  // ховає. Одна друкарка на двох не годиться · тексти йдуть одночасно.
  var thinkStream = B.typer(null, { onPaint: paintThinking });
  var feed = B.streamFeed(stream, thinkStream);

  // Пам'ять вікон: сервер тримає лише хвіст, тому початок роботи після
  // перезавантаження сторінки взяти нема звідки. Мітка · пачка (або сесія,
  // поки пачки немає): змінилась мітка, і старий запис зникає сам.
  var streamKeep = B.keep('run.stream');
  var journalKeep = B.keep('run.journal');
  B.keepPrune(['run.stream', 'run.journal']);
  var journalText = '';
  var journalTag = '';
  var journalLines = 0;   // скільки рядків журналу вже показано
  var streamTag = '';
  var rememberedAt = 0;

  // Запис у сховище · не частіше ніж раз на дві секунди: вікно може важити
  // сотні кілобайт, і писати їх на кожен знімок стану було б дорожче за саму
  // користь. Втратити при цьому можна щонайбільше останні дві секунди.
  function remember() {
    var now = Date.now();
    if (now - rememberedAt < 2000) { return; }
    rememberedAt = now;
    journalKeep.save(journalTag, journalText);
    streamKeep.save(streamTag, stream.text());
  }

  // Кожен крок має ПІДПИС станом. Сірий колір без слова змушував гадати, що
  // сталося з ремонтом · саме це власник і запитав 2026-09-05.
  var STEP_WORDS = {
    done: 'зроблено',
    now: 'іде зараз',
    skipped: 'не знадобився',
    pending: 'попереду'
  };

  function stepStatusIcon(state) {
    return B.icon(state === 'done' ? 'pass' : (state === 'skipped' ? 'dot' : 'circle'), 'step-status-icon');
  }

  function renderRunContext(s, b, completed, resume) {
    var nav = B.el('nav');
    var env = B.el('navRunEnv');
    var steps = B.el('navRunSteps');
    if (!nav || !env || !steps) { return; }
    env.textContent = B.el('env').textContent;
    env.style.background = B.el('env').style.background;
    env.style.color = B.el('env').style.color;
    var navStepsKey = JSON.stringify((s.steps || []).map(function (st) {
      return { state: st.state || 'pending', label: st.label };
    }));
    if (navStepsKey !== lastNavStepsKey) {
      lastNavStepsKey = navStepsKey;
      steps.innerHTML = (s.steps || []).map(function (st, i) {
        var stepState = st.state || 'pending';
        return (i ? '<span class="arrow" aria-hidden="true">›</span>' : '')
          + '<span class="step ' + stepState + '" title="' + B.esc(STEP_WORDS[stepState] || stepState) + '">'
          + stepStatusIcon(stepState) + '<span class="n">' + B.esc(st.label) + '</span></span>';
      }).join('');
    }
    var navStop = B.el('navStopBtn');
    var navContinue = B.el('navContinueBtn');
    var navStart = B.el('navStartLink');
    if (navStop) { navStop.disabled = !s.running; }
    if (navContinue) {
      navContinue.style.display = (resume || completed) ? '' : 'none';
      navContinue.disabled = !resume;
      navContinue.setAttribute('aria-disabled', String(!resume));
    }
    if (navStart) { navStart.style.display = resume ? 'none' : ''; }
  }

  function bindRunContext() {
    var steps = B.el('steps');
    var nav = B.el('nav');
    if (!steps || !nav) { return; }
    var contextVisible = false;
    var setContextVisible = function (visible) {
      contextVisible = visible;
      nav.classList.toggle('run-context-visible', visible);
      var context = B.el('navRunContext');
      if (context) { context.setAttribute('aria-hidden', String(!visible)); }
    };
    var update = function () {
      if (typeof steps.getBoundingClientRect !== 'function' || typeof nav.getBoundingClientRect !== 'function') {
        setContextVisible(false);
        return;
      }
      var stepsRect = steps.getBoundingClientRect();
      var navRect = nav.getBoundingClientRect();
      var overlapsHeader = stepsRect.top < navRect.bottom && stepsRect.bottom > navRect.top;
      if (!contextVisible && overlapsHeader) {
        setContextVisible(true);
      } else if (contextVisible && stepsRect.top > navRect.bottom) {
        setContextVisible(false);
      }
    };
    window.addEventListener('scroll', update, { passive: true });
    window.addEventListener('resize', update);
    update();
    B.el('navStopBtn').onclick = function () { B.el('stopBtn').click(); };
    B.el('navContinueBtn').onclick = function () { B.el('continueBtn').click(); };
  }

  // Малюємо ТЕКСТОМ, а не розміткою: `innerHTML` на кожен кадр змушував браузер
  // щоразу заново розбирати рядок, і саме це додавало ривків.
  //
  // Обрізання тут БУЛО і власник назвав його прямо 2026-09-06: показувалось
  // останні 4000 символів, тобто початок відповіді ролі зникав з очей назавжди
  // · сервер його вже не пам'ятає (знімок тримає лише хвіст журналу). Тепер
  // вікно показує ВСЮ відповідь, а межа лишається тільки як запобіжник від
  // нескінченного зростання вузла.
  // Вікно роздумів. Чернетка моделі · це НЕ відповідь, тому вона приглушена й
  // підписана; ховається чипом і памʼятає вибір власника між сесіями.
  function paintThinking(text) {
    var wrap = B.el('thinkwrap');
    var box = B.el('thinkbox');
    if (!wrap || !box) { return; }
    var wasEmpty = !box.textContent;
    wrap.style.display = 'block';
    // Підпис іде за текстом, а не за миттю малювання картки: інакше він
    // застигає на «ще не почались» і бреше просто над живим друком.
    var state = B.el('thinkstate');
    if (state) {
      var label = B.thinkingLabel(text, thinkSetting);
      if (state.textContent !== label) { state.textContent = label; }
    }
    var answer = B.el('streambox');
    if (text && wasEmpty && (!answer || !answer.textContent)) { wrap.open = true; }
    if (!text) { wrap.open = false; box.textContent = ''; return; }
    // Хвіст тримаємо, ПОКИ читач унизу · те саме правило, що в журналі кроків.
    // Інакше прокрутка вгору воювала б із потоком і читати було б неможливо.
    var atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 24;
    box.textContent = text;
    if (atBottom) { box.scrollTop = box.scrollHeight; }
  }

  function paintStream(text) {
    var box = B.el('streambox');
    if (!box) { return; }
    // Перший символ прибирає прелоадер · далі місце потрібне самому тексту.
    var wait = B.el('livewait');
    if (wait && text) { wait.innerHTML = ''; }
    if (!text) {
      box.style.display = 'block'; box.textContent = '';
      var resetThinking = B.el('thinkwrap');
      if (resetThinking) { resetThinking.dataset.autoCollapsed = '0'; }
      return;
    }
    box.style.display = 'block';
    var thinking = B.el('thinkwrap');
    if (thinking && thinking.dataset.autoCollapsed !== '1') {
      thinking.open = false;
      thinking.dataset.autoCollapsed = '1';
    }
    var atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 24;
    var body = box.firstChild;
    if (!body || body.nodeType !== 3) {
      box.textContent = '';
      body = document.createTextNode('');
      box.appendChild(body);
      var caret = document.createElement('span');
      caret.className = 'caret';
      box.appendChild(caret);
    }
    body.nodeValue = text;
    if (atBottom) { box.scrollTop = box.scrollHeight; }
  }

  // Розгортання роботи виклику ПРЯМО в списку. Тягнемо лише на вимогу: відповідь
  // ролі це сотні кілобайт, і вантажити їх для кожного рядка списку означало б
  // мегабайти на кожну перемальовку.
  function bindOpenCall() {
    Array.prototype.forEach.call(B.el('calls').querySelectorAll('.openCall'), function (btn) {
      btn.onclick = function () {
        var card = btn.closest('.msg');
        var box = card.querySelector('.callWork');
        if (box.style.display !== 'none') {
          box.style.display = 'none';
          btn.textContent = 'розгорнути роботу';
          return;
        }
        box.style.display = 'block';
        btn.textContent = 'згорнути';
        if (box.dataset.loaded === '1') { return; }
        box.innerHTML = B.loadingHtml('беру роботу ролі з диска…');
        B.get('/api/call?' + card.dataset.call).then(function (d) {
          if (d.error) {
            box.innerHTML = '<div class="empty">' + B.esc(d.hint || 'виклик не знайдено') + '</div>';
            return;
          }
          box.dataset.loaded = '1';
          box.innerHTML = '<div class="call-work-grid">'
            + part('Запит', d.payload)
            + '<section class="call-work-item answer-work">'
            + '<div class="empty" style="margin-top:8px">Відповідь</div>'
            + '<details class="call-thinking">'
            + '<summary>Роздуми</summary>'
            + (d.thinking
              ? '<pre class="log work">' + B.esc(B.prettyWorkText(d.thinking.text || d.thinking)) + '</pre>'
              : '<div class="empty thinking-unavailable">Роздуми не збережені в завершеному виклику</div>')
            + '</details>'
            + (d.answer
              ? '<pre class="log work">' + B.esc(B.prettyWorkText(d.answer.text)) + '</pre>'
              : '<div class="empty answer-unavailable">файла немає (відповіді не було)</div>')
            + '</section>'
            + '</div>';
        }).catch(function () {
          box.innerHTML = '<div class="empty">сервер не відповів</div>';
        });
      };
    });
  }

  function part(title, work) {
    if (!work) {
      return '<section class="call-work-item">'
        + '<div class="empty" style="margin-top:6px">' + B.esc(title)
        + ' · файла немає (пачку прибрано або відповіді не було)</div></section>';
    }
    var kb = work.size < 1024 ? work.size + ' Б' : Math.round(work.size / 1024) + ' КБ';
    return '<section class="call-work-item"><div class="empty" style="margin-top:8px">' + B.esc(title) + ' · '
      + B.esc(work.path) + ' · ' + kb + (work.truncated ? ' · показано перші 2 МБ' : '') + '</div>'
      // Клас `work` тримає блок нижчим за журнал кроків: два технічні файли
      // по 12 КБ при спільній стелі 420 px давали пів екрана сирого JSON.
      + '<pre class="log work">' + B.esc(B.prettyWorkText(work.text)) + '</pre></section>';
  }

  // Фільтр вердиктів живе поза `render`: перемальовка знімка не має скидати
  // вибір власника. Саме так поводиться прототип.
  // Фільтр вердиктів переживає перезавантаження: власник дивиться «на перегляд»
  // пачку за пачкою, і скидати вибір на кожному відкритті означало б клікати
  // його щоразу.
  var VP = B.pref('run');
  var verdictFilter = String(VP.get('verdictFilter', 'all'));
  // Пошуковий запит — теж вибір власника: переживає перезавантаження поруч
  // із chip-фільтром, але згоду на PROD тут не чіпає (її немає на цьому екрані).
  var verdictQuery = String(VP.get('verdictQuery', ''));
  var lastVerdictKey = '';

  function renderVerdicts(v) {
    var items = v.items || [];
    var panel = B.el('verdictPanel');
    if (!items.length) { panel.style.display = 'none'; return; }
    panel.style.display = 'block';

    // Перемальовуємо лише коли зміст СПРАВДІ змінився: інакше кожен знімок
    // стану переписував би десятки вузлів раз на секунду без причини.
    var key = v.total + '|' + v.pass + '|' + v.review + '|' + v.reject + '|' + items.length;
    if (key !== lastVerdictKey) {
      lastVerdictKey = key;
      // ЧИСЛА ВИДНО Й ЗГОРНУТИМ · це весь сенс згортання: не «щось там є», а
      // скільки саме пройшло, скільки на перегляд і скільки відхилено, з
      // підписом біля кожного числа. Пишемо ПІД тим самим сторожем, що й
      // список: перша редакція оновлювала підсумок на кожному знімку, і
      // `web-inner-html-guard` спіймав це першим же прогоном · щосекундний
      // перезапис вузла без жодної зміни є рівно тим класом, проти якого той
      // сторож і стоїть.
      B.el('verdictCounts').innerHTML =
        'усі <b>' + B.num(v.total) + '</b>'
        + ' · пройшло <b style="color:var(--ok-tx)">' + B.num(v.pass) + '</b>'
        + ' · на перегляд <b style="color:var(--wr-tx)">' + B.num(v.review) + '</b>'
        + ' · відхилено <b style="color:' + (Number(v.reject) ? 'var(--dn-tx)' : 'inherit') + '">'
        + B.num(v.reject) + '</b>';
      // Кнопка збереженого фільтра мусить виглядати натиснутою, інакше показ
      // і підпис розійдуться.
      Array.prototype.forEach.call(document.querySelectorAll('#verdictPanel .chip'), function (c) {
        c.setAttribute('aria-pressed', c.dataset.f === verdictFilter ? 'true' : 'false');
      });
      B.el('verdicts').innerHTML = items.map(function (r) {
        // Клас, а не зібране рядком імʼя змінної: `var(--' + color + '-bg)`
        // не бачить ні редактор, ні інспекція · вони мають рацію, бо таку
        // назву неможливо перевірити.
        var kind = r.kind || 'none';
        var icon = { pass: 'pass', review: 'review', reject: 'reject', none: 'dot' }[kind] || 'dot';
        return '<div class="vrow" data-v="' + B.esc(kind) + '">'
          + '<span class="pill v-' + B.esc(kind) + '"><span class="verdict-icon" aria-hidden="true">'
          + B.icon(icon) + '</span> ' + B.esc(r.label) + '</span>'
          + '<div style="flex:1;min-width:0">'
          // ПІДПИСАНО Й ОЧИЩЕНО. Без підпису два монотипні рядки поспіль
          // читались як один текст, а PA-розмітка робила з них стіну на пів
          // екрана (D105). Повний рядок · у підказці.
          + '<div class="empty" style="font-size:11px">оригінал</div>'
          + '<div class="mono" style="color:var(--tm)" title="' + B.esc(r.source) + '">'
          + B.esc(B.plain(r.source)) + '</div>'
          + (r.text
              ? '<div class="empty" style="font-size:11px;margin-top:4px">переклад</div>'
                + '<div class="mono" title="' + B.esc(r.text) + '">'
                + B.esc(B.plain(r.text)) + '</div>'
              : '<div class="empty" style="margin-top:4px">перекладу ще немає</div>')
          + (r.issue ? '<div class="vissue" title="натисни, щоб розгорнути">'
              + B.esc(r.issue) + '</div>' : '')
          + '</div></div>';
      }).join('');
      applyVerdictFilter();
      // Довгий вирок розгортається кліком по ньому самому · окрема кнопка на
      // кожен рядок була б шумом там, де таких рядків десятки.
      Array.prototype.forEach.call(B.el('verdicts').querySelectorAll('.vissue'), function (n) {
        n.onclick = function () { n.classList.toggle('open'); };
      });
    }
    // НУЛЬ ВИРОКІВ · НОРМАЛЬНИЙ СТАН, А НЕ ПОМИЛКА. «0 з вироком» поруч із
    // повними текстами читалось як збій, хоч це просто «QA ще не проходив»
    // (знімок власника 2026-09-07, D107).
    var meta;
    if (v.total === 0) {
      meta = ['вироків ще немає · перевірка якості не проходила'];
    } else {
      meta = [B.num(v.total) + ' з вироком'];
      if (items.length < v.total) { meta.push('показано ' + items.length); }
    }
    B.el('verdictMeta').textContent = meta.join(' · ');
    setChip('all', v.total);
    setChip('pass', v.pass);
    setChip('review', v.review);
    setChip('reject', v.reject);
  }

  function setChip(name, count) {
    var btn = B.el('verdictPanel').querySelector('.chip[data-f="' + name + '"]');
    if (!btn) { return; }
    var words = { all: 'усі', pass: 'пройшло', review: 'на перегляд', reject: 'відхилено' };
    btn.textContent = words[name] + ' ' + B.num(count || 0);
    // Порожню категорію ховаємо: кнопка «відхилено 0» пропонує подивитись на
    // те, чого немає.
    btn.style.display = (name === 'all' || count) ? '' : 'none';
  }

  function callStatus(c) {
    if (c.verdict === 'ok') {
      return { kind: 'ok', icon: 'pass', label: 'готово', card: 'is-ok' };
    }
    if (c.verdict === 'truncated') {
      return { kind: 'failed', icon: 'review', label: 'відповідь обрізано', card: 'is-failed' };
    }
    return { kind: 'review', icon: 'review', label: c.verdict || 'перевірити', card: 'is-review' };
  }

  function roleIcon(role) {
    var icons = {
      'translation-terminology': 'book',
      'translation-worker': 'pen',
      'translation-qa': 'search',
      'translation-repair': 'wrench',
      'translation-names': 'tag',
      'translation-judge': 'scale',
      'translation-glossary': 'library',
      'translation-smoke': 'flask'
    };
    return B.icon(icons[role] || 'dot', 'role-icon');
  }

  function applyVerdictFilter() {
    var q = verdictQuery.trim().toLowerCase();
    Array.prototype.forEach.call(B.el('verdicts').querySelectorAll('.vrow'), function (r) {
      var byChip = verdictFilter === 'all' || r.dataset.v === verdictFilter;
      // Пошук іде по видимому тексту рядка (джерело + переклад + вирок QA):
      // окремих data-атрибутів не треба, а chip-фільтр лишається головним.
      var byText = !q || r.textContent.toLowerCase().indexOf(q) !== -1;
      r.style.display = (byChip && byText) ? 'flex' : 'none';
    });
  }

  // Поле пошуку підхоплює збережений запит: перезавантаження сторінки не має
  // губити вибір власника — так само, як chip-фільтр вище.
  (function () {
    var input = document.getElementById('verdictSearch');
    if (!input) { return; }
    input.value = verdictQuery;
    input.addEventListener('input', function () {
      verdictQuery = input.value;
      VP.set('verdictQuery', verdictQuery);
      applyVerdictFilter();
    });
  })();

  Array.prototype.forEach.call(document.querySelectorAll('#verdictPanel .chip'), function (c) {
    c.onclick = function () {
      Array.prototype.forEach.call(document.querySelectorAll('#verdictPanel .chip'), function (o) {
        o.setAttribute('aria-pressed', 'false');
      });
      c.setAttribute('aria-pressed', 'true');
      verdictFilter = c.dataset.f;
      VP.set('verdictFilter', verdictFilter);
      applyVerdictFilter();
      // Довгий вирок розгортається кліком по ньому самому · окрема кнопка на
      // кожен рядок була б шумом там, де таких рядків десятки.
      Array.prototype.forEach.call(B.el('verdicts').querySelectorAll('.vissue'), function (n) {
        n.onclick = function () { n.classList.toggle('open'); };
      });
    };
  });

  function render(s) {
    // Чинні параметри моделі в хедері · оновлюються тим самим знімком, тому не
    // можуть розійтися з тим, що бачить решта екрана.
    B.renderModelParams(s.model);
    thinkSetting = s.model && typeof s.model.think === 'boolean' ? s.model.think : null;
    var target = (s.env || '').toUpperCase() || '—';
    var envEl = B.el('env');
    envEl.textContent = target;
    envEl.style.background = target === 'PROD' ? 'var(--dn-bg)' : 'var(--s2)';
    envEl.style.color = target === 'PROD' ? 'var(--dn-tx)' : 'var(--ts)';

    var b = s.batch || {};
    if (b.id) {
      var bits = [b.id];
      if (b.patch) { bits.push(b.patch === 'active' ? 'активний патч' : 'патч ' + b.patch); }
      bits.push(B.num(b.rows) + ' рядків');
      if (b.domain) { bits.push(b.domain); }
      B.el('batch').textContent = bits.join(' · ');
      B.el('statePhrase').textContent = b.state_phrase || b.state_label || '—';
    } else {
      B.el('batch').textContent = '';
      B.el('statePhrase').textContent = 'пачки немає';
    }
    // ПРОГРЕС ПАЧКИ · за КРОКАМИ конвеєра, а не за рядками.
    //
    // Перша редакція рахувала `b.rows − s.remaining`, і це було хибно за
    // побудовою: `remaining` · це рядки, що лишились у ЦІЛІ прогону (29 372 на
    // патчі 1), а не в пачці на 20 рядків. Різниця виходила відʼємною,
    // затискалась у нуль, і смуга завжди показувала 0% · тобто число, яке
    // виглядає осмисленим і бреше. Заміряно 2026-09-06.
    //
    // Кроки ж є прямо в знімку й описують саме ЦЮ пачку: `done` і `skipped`
    // позаду, `now` іде, решта попереду.
    (function () {
      var wrap = B.el('batchProgressWrap');
      var bar = B.el('batchProgress');
      if (!wrap || !bar) { return; }
      var steps = s.steps || [];
      if (!b.id || !steps.length) { wrap.style.display = 'none'; return; }
      var passed = steps.filter(function (st) {
        return st.state === 'done' || st.state === 'skipped';
      }).length;
      wrap.style.display = 'block';
      wrap.title = 'пройдено кроків ' + B.num(passed) + ' з ' + B.num(steps.length);
      bar.style.width = Math.round(passed / steps.length * 100) + '%';
      // ЗАВЕРШЕНЕ ВИГЛЯДАЄ ЗАВЕРШЕНИМ. Синя смуга на 100% нічим не відрізнялась
      // від синьої смуги, що ось-ось зрушить, і пачка виглядала так, ніби вона
      // ще йде. Колір міняє САМЕ завершення, а не близькість до кінця.
      bar.classList.toggle('done', passed === steps.length);
    })();
    // Скільки триває прогін · у прототипі це `3:41` у правому куті шапки.
    // Показуємо ЛИШЕ поки він іде: `run-target` живе й після завершення, і
    // лічильник, що біжить над зупиненим прогоном, каже неправду.
    // ЛІЧИЛЬНИК ВЕДЕ СТОРІНКА, А НЕ ПОТІК. Раніше цифра приходила з кожним
    // знімком · і тільки заради неї сервер слав повні 65 КБ щосекунди, бо хеш
    // стану щоразу інший (D168). Тепер беремо `started_at` і цокаємо самі:
    // канал мовчить, поки в прогоні нічого не змінилось, а цифра жива.
    B.runClock(s.running && s.run ? s.run : null);
    var goal = B.el('goal');
    goal.textContent = (s.goal && s.goal.phrase) ? s.goal.phrase : 'ціль прогону не зафіксована';
    // Сам запит до API лишається в підказці: він потрібен при розборі, але на
    // екрані власника мусить стояти те, що робиться, а не як відібрано рядки.
    goal.title = (s.goal && s.goal.query) ? 'вибірка: ' + s.goal.query : '';

    // Хлібний слід: стан каже КОЛІР, а слово лишається в підказці · шість
    // однакових «зроблено» під кроками не додавали нічого, крім висоти.
    var stepsKey = JSON.stringify((s.steps || []).map(function (st) {
      return { state: st.state || 'pending', label: st.label };
    }));
    if (stepsKey !== lastStepsKey) {
      lastStepsKey = stepsKey;
      B.el('steps').innerHTML = (s.steps || []).map(function (st, i) {
      var state = st.state || 'pending';
      return (i ? '<span class="arrow">›</span>' : '')
        + '<span class="step ' + state + '" title="' + B.esc(STEP_WORDS[state] || state) + '">'
        + stepStatusIcon(state) + '<span class="n">' + B.esc(st.label) + '</span></span>';
      }).join('');
    }

    var sum = s.summary || {};
    var callsView = s.calls || { scope: 'session', items: [] };
    var calls = callsView.items || [];
    // ТЕСТОВИЙ ПРОГІН НЕ МАЄ ПОКАЗУВАТИ НУЛІ ЯК РЕЗУЛЬТАТ. Пачка без дозволу на
    // запис фізично не може нічого записати, тому «у шар 0 · до людини 0» тут
    // не результат роботи, а наслідок режиму · власник побачив ці нулі після
    // завершеної тестової пачки й спитав, що зламалось (2026-09-18). Ставимо
    // риску (наш знак «не застосовується») і пояснюємо словами під картками.
    var dry = b.write === false;
    var cards = [
      ['у шар', dry ? null : sum.to_layer, 'var(--ok-tx)'],
      ['до людини', dry ? null : sum.to_human, ''],
      ['карантин', dry ? null : sum.quarantine, (!dry && sum.quarantine ? 'var(--dn-tx)' : '')],
      ['викликів моделі', calls.length, '']
    ];
    var cardsKey = JSON.stringify(cards);
    if (cardsKey !== lastCardsKey) {
      lastCardsKey = cardsKey;
      B.el('cards').innerHTML = cards.map(function (c) {
        var v = (c[1] === undefined || c[1] === null) ? '—' : B.num(c[1]);
        return '<div class="card"><div class="l">' + B.esc(c[0]) + '</div>'
          + '<div class="v"' + (c[2] ? ' style="color:' + c[2] + '"' : '') + '>' + v + '</div></div>';
      }).join('')
        + (dry
          ? '<div class="empty cards-note">тестовий прогін · на сервер не йшло нічого, тому записаних рядків тут немає'
            + ' · вироки ролей нижче справжні</div>'
          : '');
    }

    var meta = [];
    // ПАУЗА НЕ Є ЗУПИНКОЮ, і рядок стану мусить це казати. Інакше власник
    // бачить «прогін не йде» і не розуміє, він спинився сам чи стоїть тому, що
    // його поставили на паузу · пачка ж при цьому ціла.
    meta.push(s.paused ? 'на паузі' : (s.running ? 'прогін іде' : 'прогін не йде'));
    if (s.paused && s.paused.reason) { meta.push(s.paused.reason); }
    if (b.updated_ago) { meta.push('останній рух ' + b.updated_ago); }
    if (s.session && s.session.id) { meta.push('сесія ' + s.session.id + ' · пачок ' + B.num(s.session.batches)); }
    if (s.remaining !== null && s.remaining !== undefined) { meta.push('лишилось рядків ' + B.num(s.remaining)); }
    B.el('meta').textContent = meta.join(' | ');
    B.el('stopBtn').disabled = !s.running;
    // Кнопка паузи має сенс лише поки цикл іде: на зупиненому прогоні вона
    // поклала б прапорець, який нікому читати, і власник вирішив би, що набір
    // його не послухав.
    B.el('pauseBtn').disabled = !s.running || !!s.paused;
    B.el('pauseBtn').title = s.paused
      ? 'прогін уже на паузі · «продовжити пачку» зніме її'
      : 'дати поточному кроку дописати результат і спинитись між ролями';

    // ПАЧКА, ЩО СТОЇТЬ, МУСИТЬ СКАЗАТИ ЦЕ ВГОЛОС І НАЗВАТИ ВИХІД.
    //
    // Пачка не закрита, прогону немає · екран виглядав як «висить»: стан
    // показує крок, кнопка «зупинити» сіра й ні на що не реагує, а що робити
    // далі · ніде. Власник назвав це прямо 2026-09-07: «не зрозуміло, зависла
    // пачка чи що». Причин зупинки дві й обидві законні: людина натиснула
    // «зупинити» або цикл вийшов сам · і в обох випадках вихід той самий.
    var idle = B.el('actionMsg');
    var batchState = b.state || '';
    // `verified` є канонічним завершеним станом пачки. `closed` — це стан
    // сесії, а не пачки, тому перевірка його тут пропускала завершені пачки
    // в гілку «можна продовжити» (саме так зʼявлявся суперечливий екран).
    var completed = !s.running && !!b.id && batchState === 'verified';
    var resume = !s.running && !!b.id && !completed && batchState !== 'failed_terminal';
    if (completed) {
      idle.textContent = 'Пачку завершено автоматично · стоїть на кроці «'
        + (b.state_label || batchState) + '». Це не зависання і не ручна зупинка. '
        + 'Продовження цієї пачки недоступне.';
      idle.style.color = 'var(--ok-tx)';
      idle.dataset.batchMessage = 'completed';
    } else if (resume) {
      // ХТО ЗУПИНИВ · тепер це ФАКТ із журналу пачки, а не здогад. Раніше
      // тут стояло «кнопкою „зупинити“ або сам», бо відрізнити було
      // неможливо: `watch --stop` не писав нічого (D98).
      var why = b.human_stop && b.human_stop.reason
        ? 'Зупинив ви: ' + b.human_stop.reason + ' (' + b.human_stop.ago + ').'
        : 'Підпису про зупинку людиною немає · цикл завершився сам.';
      // ПРОДОВЖЕННЯ НАЗИВАЄМО ПРЯМО. «Почати прогін» звучить як «з нуля», але
      // `mode start` при незакритій пачці РОБИТЬ RESUME і веде цю саму пачку
      // з того самого кроку (`cli/run/run-mode.sh`). Власник питав, чи є
      // взагалі функціонал продовження · він є, просто так не називався.
      idle.textContent = 'Пачка не закрита · стоїть на кроці «'
        + (b.state_label || b.state || '?') + '». Це не зависання. ' + why
        + ' Щоб ПРОДОВЖИТИ саму цю пачку з цього кроку · кнопка «продовжити пачку» вгорі праворуч: '
        + 'нова пачка не братиметься, поки ця не закрита.';
      idle.style.color = 'var(--wr-tx)';
      idle.dataset.batchMessage = 'resume';
    } else if (idle.dataset.batchMessage) {
      idle.textContent = '';
      idle.style.color = '';
      delete idle.dataset.batchMessage;
    }
    // ПРОДОВЖИТИ · КНОПКА, ЯКА ПРОДОВЖУЄ. Поки пачка стоїть, вона головна й
    // видима, а «новий прогін» ховається: два схожі виходи поруч і дали
    // плутанину, через яку власник опинився на формі замість прогону (D101).
    var contBtn = B.el('continueBtn');
    var startLink = B.el('startLink');
    if (contBtn) {
      // Завершену пачку залишаємо видимою, але явно вимкненою: власник бачить,
      // що продовження існує для перерваних пачок, але тут воно недоступне.
      contBtn.style.display = (resume || completed) ? '' : 'none';
      contBtn.disabled = !resume;
      contBtn.setAttribute('aria-disabled', String(!resume));
      contBtn.title = resume
        ? 'веде пачку ' + b.id + ' далі з кроку «' + (b.state_label || b.state || '?')
          + '» · нова пачка не братиметься'
        : completed ? 'пачку завершено автоматично · продовження недоступне' : '';
    }
    if (startLink) { startLink.style.display = resume ? 'none' : ''; }
    renderRunContext(s, b, completed, resume);

    // РОЛЬ ВИДНО ВЕСЬ ЧАС, ПОКИ ВОНА ПРАЦЮЄ · не лише поки йдуть символи.
    //
    // Умовою була сама СВІЖІСТЬ журналу токенів (рух за останні 15 с), тому
    // картка зникала щоразу, коли модель мовчала довше: вантажила вагу,
    // обробляла промпт або просто довго думала між чанками. Власник
    // 2026-09-19 бачив рівно це: прогін іде, модель працює, а на екрані
    // немає нічого. Тепер тримає ЗНАК живого виклику (`stream.active`), а
    // свіжість лишається запасним шляхом для прогону з термінала.
    var live = (s.stream && s.stream.role_label && (s.stream.active || s.stream.fresh))
      ? s.stream.role_label : '';
    // ЖИВА КАРТКА Є ЧАСТИНОЮ КЛЮЧА. Сторож ключа рятує від перемальовування
    // щосекунди, але має сліпу пляму: коли роль договорила, список ВИКЛИКІВ ще
    // не змінився, і картка «друкує…» лишалась на екрані назавжди · власник
    // бачив «підстановка назв друкує…» через три хвилини після завершення
    // пачки (2026-09-17). Мітка живої ролі стала частиною ключа: поки роль
    // друкує, вона стала, тому зайвого перемальовування не додає.
    var key = calls.map(function (c) { return c.at + c.role + c.verdict + c.ms; }).join('|')
      + '|друкує:' + live;
    if (key !== lastCallsKey || (live && !B.el('streambox'))) {
      lastCallsKey = key;
      var html = calls.length ? calls.map(function (c) {
        var status = callStatus(c);
        var bits = [];
        // Скільки рядків пішло в модель · без цього «53 с» не має знаменника:
        // незрозуміло, це один важкий рядок чи десять легких.
        // Одиницю називає СЕРВЕР: термінолог рахує терміни, а не рядки пачки, і
        // «136 рядків» на пачці з 50 рядків читалось як помилка.
        if (c.rows) { bits.push(B.num(c.rows) + ' ' + (c.unit || 'рядків')); }
        if (c.in || c.out) { bits.push(B.num(c.in) + '→' + B.num(c.out) + ' ток.'); }
        // Вага самого payload · це «навантаження JSON», яке готує рушій.
        // Токени рахуються ПІСЛЯ підміни хешів на короткі ключі, тому два
        // числа поруч показують, скільки важать службові поля.
        if (c.payload_bytes) { bits.push(Math.round(c.payload_bytes / 1024) + ' КБ payload'); }
        if (c.ms) { bits.push(B.secs(c.ms)); }
        var thinkingIndicator = '<span class="thinking-indicator ' + (c.think ? 'has-thinking' : 'no-thinking')
          + '" role="img" aria-label="' + (c.think ? 'із міркуваннями' : 'без міркувань')
          + '" title="' + (c.think ? 'із міркуваннями' : 'без міркувань') + '">' + B.icon('thinking') + '</span>';
        // РОБОТУ ЗАВЕРШЕНОГО ВИКЛИКУ можна відкрити · власник попросив бачити
        // її після закінчення ролі, а не тільки поки друкується (2026-09-06).
        // Ключ виклику · час і роль, той самий, що приймає `/api/call`.
        var key2 = 'at=' + encodeURIComponent(c.at) + '&role=' + encodeURIComponent(c.role);
        return '<div class="msg role-card ' + status.card + '" data-call="' + B.esc(key2) + '"><div class="mh">'
          + roleIcon(c.role) + '<span style="font-weight:500">' + B.esc(c.role_label) + '</span>'
          + '<span class="meta">' + B.esc(bits.join(' · ')) + '</span>'
          + '<span class="chip role-state ' + status.kind + '" style="margin-left:auto">'
          + '<span class="verdict-icon" aria-hidden="true">' + B.icon(status.icon) + '</span> '
          + B.esc(status.label) + '</span>'
          + '<span class="meta" style="margin-left:8px">' + B.esc(c.hms) + '</span>'
          + thinkingIndicator + '</div>'
          + '<div class="bar" style="margin-top:6px">'
          + '<button class="openCall" type="button">розгорнути роботу</button>'
          + '<a href="/call?' + B.esc(key2) + '" target="_blank" rel="noopener"'
          + ' style="font-size:12px;color:var(--acc-tx)">на весь екран ↗</a></div>'
          + '<div class="callWork" style="display:none"></div></div>';
      }).join('') : '<div class="empty">' + B.esc(callsView.reason || 'викликів немає') + '</div>';
      // Роль, яка друкує ЗАРАЗ, ще не має рядка в журналі викликів: він
      // пишеться ПІСЛЯ відповіді. Тому її картка малюється окремо.
      if (live && (s.running || (s.stream && s.stream.active))) {
        // ЩО САМЕ ЗАРАЗ · «друкує…» лише коли справді йдуть символи.
        //
        // Ollama вивантажує вагу за налаштуванням машини (у власника 5 хвилин),
        // і перший виклик після паузи спершу вантажить 23 ГБ. На живому прогоні
        // це дало 960 секунд повного мовчання · виглядало як «зависло».
        var waiting = (s.stream && s.stream.waiting) || 0;
        var loading = waiting >= 12;
        // ПОРОЖНЬОГО МІСЦЯ НЕ БУВАЄ. Поки не прийшов перший символ, у блоці
        // відповіді крутиться прелоадер із секундами · власник просив бачити,
        // що щось відбувається, навіть коли модель ще нічого не сказала.
        var silent = !(s.stream && (s.stream.text || s.stream.thinking));
        var liveThinking = '<span class="thinking-indicator ' + (s.stream.thinking ? 'has-thinking' : 'no-thinking')
          + '" role="img" aria-label="' + (s.stream.thinking ? 'із міркуваннями' : 'без міркувань')
          + '" title="' + (s.stream.thinking ? 'із міркуваннями' : 'без міркувань') + '">' + B.icon('thinking') + '</span>';
        html += '<div class="msg active role-card is-active"><div class="mh">'
          + roleIcon(s.stream.role) + '<span style="font-weight:500;color:var(--acc-tx)">' + B.esc(live) + '</span>'
          + '<span class="meta" id="liveNote">' + (loading
              ? 'модель вантажиться, ' + waiting + ' с · перший виклик після паузи тягне вагу з диска'
              : 'друкує…') + '</span>'
          + '<span class="chip role-state running" style="margin-left:auto"><span class="verdict-icon" aria-hidden="true">●</span> друкує</span>'
          + liveThinking

          // ЩО ПІШЛО В МОДЕЛЬ · доступне поки роль ще друкує, а не лише після.
          // Шлях дає сервер (`stream.payload`), сторінка його не вгадує.
          + ((s.stream && s.stream.payload)
              ? '<span class="chip live-source" aria-label="джерело запиту">запит</span>'
              : '')
          + '</div>'
          + '<div class="active-work live-work-grid">'
          + '<section class="live-request live-work-section">'
          + '<div class="empty live-section-title">Запит</div>'
          + '<div class="box mono" id="reqbox"></div>'
          + '</section>'
          + '<section class="live-answer live-work-section">'
          // РОЗДУМИ ПІДПИСАНІ Й ВИДНО ЗАВЖДИ, коли вони є.
          //
          // Чип тут БУВ і виявився марним: він живе лише в картці ЖИВОГО
          // виклику, тому поза прогоном його немає взагалі · власник тиснув
          // і «нічого не відбувалось» (D103). Ховати чернетку теж не треба:
          // вона потрібна саме тоді, коли роль думає. Лишається одне ·
          // ВІДРІЗНИТИ її від відповіді, і це робить підпис, а не кнопка.
          + '<details id="thinkwrap" class="call-thinking">'
          // ТРИ СТАНИ, А НЕ ДВА. Раніше підпис питав лише, чи Є ТЕКСТ, і за його
          // відсутності писав «міркування вимкнено» · тобто видавав ще не
          // початі роздуми за вимкнену настройку. Власник 2026-09-17 побачив цей
          // підпис при увімкнених роздумах, які попередні ролі справно видавали.
          // Тепер настройка приходить окремим фактом (`model.think`), і невідомий
          // стан теж називається собою, а не підміняється «вимкнено».
          //
          // ПІДПИС ОНОВЛЮЄ `paintThinking`, А НЕ ЦЕЙ РЯДОК. Картка малюється
          // один раз на виклик (сторож ключа), тому напис, зроблений тут,
          // застигав назавжди: власник бачив «ще не почались» над роздумами,
          // які в цю мить друкувались. Тут лишається лише ПЕРШИЙ стан.
          + '<summary>Роздуми <span class="meta" id="thinkstate">'
          + B.thinkingLabel(s.stream.thinking, s.model && s.model.think)
          + '</span></summary>'
          // Роздуми МОЖНА перечитати: без межі висоти й прокрутки блок ріс
          // нескінченно, показував лише хвіст, і повернутись до початку думки
          // було нікуди (власник 2026-09-14, жива пачка на 42 КБ роздумів).
          + '<div class="box mono" id="thinkbox" style="color:var(--tm);max-height:260px;overflow-y:auto"></div></details>'
          + (loading
              ? '<div class="empty" style="margin-top:6px">Це не зависання: Ollama вивантажує модель за своїм '
                + 'налаштуванням, і наступні виклики підуть без цієї паузи.</div>'
              : '')
          + '<div class="empty live-answer-title">Відповідь</div>'
          // Прелоадер живе ПОРУЧ із блоком друку, а не всередині: друкарка
          // чистить `#streambox` на кожному порожньому тексті й затерла б його.
          + '<div id="livewait">' + (silent ? B.loadingHtml(loading
              ? 'модель вантажиться · ' + waiting + ' с'
              : 'модель готує відповідь · ' + waiting + ' с') : '') + '</div>'
          + '<div class="box mono live-print" id="streambox" aria-live="polite"></div>'
          + '</section></div></div>';
      }
      B.el('calls').innerHTML = html;
      bindOpenCall();
      var req = B.el('reqbox');
      if (req && s.stream && s.stream.payload) {
        B.busy(req, 'беру запит ролі…');
        // Шлях НЕ передаємо: його називає сервер. Інакше цей самий виклик
        // читав би будь-що під `state/`, зокрема токен.
        B.get('/api/call?live=1').then(function (d) {
          // ЗАПИТ ЧИТАЮТЬ ОЧИМА · той самий вигляд, що й у завершеному виклику.
          // Тут стояв сирий `text`, тому payload ролі показувався суцільним
          // рядком JSON, тоді як та сама робота в «розгорнути роботу» й на
          // екрані виклику була розкладена відступами (`prettyWorkText`).
          // Помічено власником 2026-09-19; рядок живе так від 7.8.3.
          var text = (d && d.payload && d.payload.text) || '';
          req.textContent = text === '' ? 'запиту ще немає на диску' : B.prettyWorkText(text);
        }).catch(function (e) {
          req.textContent = 'не вдалося взяти запит: ' + e;
        });
      }
      B.el('callsMeta').textContent = !calls.length ? ''
        : (callsView.scope === 'batch'
            ? 'пачки ' + callsView.batch + ' · ' + calls.length
            : 'цієї сесії · ' + calls.length + ' (пачку не вказано)');
      paintStream(stream.text());
      paintThinking(thinkStream.text());
    }

    // Знімок стану знає лише ХВІСТ журналу токенів (`s.stream.complete` каже,
    // чи це початок відповіді). Тому його текст ЗШИВАЄТЬСЯ з накопиченим по
    // збігу, а не підміняє його: підміна не впізнавала префікса й щосекунди
    // починала друк спочатку · саме це власник бачив як друк «порціями по
    // рядку» 2026-09-06 (D83).
    renderVerdicts(s.verdicts || {});
    feed.snapshot(s.stream);
    // Роль договорила · тягнути залишок буфера нема сенсу.
    if (!live || !s.running) { stream.flush(); }

    // Журнал кроків сервер теж віддає ХВОСТОМ (200 рядків), тому початок пачки
    // зникав з екрана. Накопичуємо його тим самим зшиванням і тримаємо в
    // пам'яті вікна · перезавантаження сторінки більше не з'їдає початок.
    var tag = String(b.id || (s.session && s.session.id) || '');
    if (tag !== journalTag) {
      // Нова мітка · беремо збережене саме під неї. Немає такого запису ·
      // `load` віддає порожньо, і вікно просто починається з чистого аркуша.
      journalTag = tag;
      journalText = journalKeep.load(tag);
      journalLines = journalText === '' ? 0 : journalText.split('\n').length;
    }
    // Журнал сервер віддає ХВОСТОМ у 200 рядків і НАЗИВАЄ номер першого з них
    // (`transcript_from`). Тому дописуємо рівно ті рядки, яких ще не бачили ·
    // без жодного зіставлення тексту. Зшивання по вмісту тут уже вигадувало
    // слова, яких модель не друкувала (D83), і повертати його не можна.
    var lines = s.transcript || [];
    var from = s.transcript_from;
    if (from === -1 || from === undefined || from > journalLines) {
      // Порахувати межу не вийшло або ми відстали більше, ніж сервер пам'ятає:
      // показуємо хвіст як є. Це видно розривом · і це чесно.
      journalText = lines.join('\n');
      journalLines = from === -1 || from === undefined ? lines.length : from + lines.length;
    } else {
      var fresh = lines.slice(journalLines - from);
      if (fresh.length) {
        journalText = journalText === '' ? fresh.join('\n') : journalText + '\n' + fresh.join('\n');
        journalLines += fresh.length;
      }
    }
    journal.write(journalText || 'журнал порожній');

    // Мітка живого друку · пачка ПЛЮС роль: у межах пачки ролі змінюють одна
    // одну, і відповідь термінолога не має відновитись у вікні перекладача.
    var sTag = tag + '/' + String((s.stream && s.stream.role) || '');
    if (sTag !== streamTag) {
      streamTag = sTag;
      var saved = streamKeep.load(sTag);
      if (saved && stream.text() === '') { stream.sync(saved); stream.flush(); }
    }
    remember();
  }

  B.live(render, function (d) { feed.delta(d); });
  bindRunContext();

  B.el('pauseBtn').onclick = function () {
    var msg = B.el('actionMsg');
    msg.style.color = '';
    msg.textContent = 'ставлю на паузу…';
    B.post('/api/action', { action: 'run.pause', confirm: true }).then(function (res) {
      var ok = res.status === 200 && (res.body || {}).ok !== false;
      msg.style.color = ok ? '' : 'var(--dn-tx)';
      msg.textContent = ok
        ? 'пауза буде після поточного кроку · пачка лишиться на місці'
        : 'не вдалося поставити паузу';
    });
  };

  B.el('continueBtn').onclick = function () {
    if (this.disabled) { return; }
    var msg = B.el('actionMsg');
    // Підтвердження питає КОД (`needs_confirm` у плані), але людині теж треба
    // сказати, що це доведе пачку до запису в PROD · так само, як новий прогін.
    if (!window.confirm('Продовжити пачку з поточного кроку?\n\n'
        + 'Ролі поїдуть далі, і завершена пачка ЗАПИШЕТЬСЯ в PROD.\n'
        + 'Нова пачка не братиметься · лише ця.')) { return; }
    msg.style.color = '';
    msg.textContent = 'продовжую…';
    B.post('/api/action', { action: 'run.continue', confirm: true }).then(function (res) {
      msg.textContent = res.status >= 400
        ? (res.body && res.body.hint ? res.body.hint : 'не вдалося · сервер відповів кодом ' + res.status)
        : 'пачка продовжена · дивись кроки нижче';
      msg.style.color = res.status >= 400 ? 'var(--dn-tx)' : 'var(--ok-tx)';
    });
  };

  B.el('stopBtn').onclick = function () {
    var msg = B.el('actionMsg');
    msg.textContent = 'зупиняю…';
    B.post('/api/action', { action: 'run.stop' }).then(function (res) {
      msg.textContent = res.status >= 400
        ? (res.body && res.body.hint ? res.body.hint : 'не вдалося · сервер відповів кодом ' + res.status)
        : 'прогін зупинено';
      msg.style.color = res.status >= 400 ? 'var(--dn-tx)' : 'var(--ok-tx)';
    });
  };
})();
</script>
</body>
</html>
