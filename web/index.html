<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>bdo · прогін</title>
<link rel="stylesheet" href="/app.css">
<!--
  ЕКРАН ПРОГОНУ · що робиться зараз.

  Екрани окремі (рішення власника 2026-09-05), тому цей файл містить лише те,
  що стосується прогону: шапка «куди пишемо / що зараз», стрічка кроків,
  підсумок, ролі та журнал кроків. Спільне (токен, навігація, живий стан,
  тримання хвоста) живе в `/app.js`.

  Дані беруться ЛИШЕ з `/api/*`. Жодного власного обліку: те, що показує це
  вікно, показує й термінал, бо джерело одне · файли `state/**`.
-->
</head>
<body>
<div class="wrap">
  <div class="nav" id="nav"></div>

  <div id="gate" class="panel" style="display:none"></div>

  <div id="app" style="display:none">
    <div class="screen-title">
      <h1>Прогін</h1>
      <span class="hint">крок за кроком: що робить кожна роль і що вже зроблено</span>
    </div>

    <div class="panel">
      <div class="head">
        <div class="row">
          <span class="lbl">куди пишемо</span>
          <span class="pill" id="env">—</span>
          <span class="empty" id="goal"></span>
        </div>
        <div class="row">
          <span class="lbl">що зараз</span>
          <span id="statePhrase" style="font-weight:500">пачки немає</span>
          <span class="mono" id="batch" style="color:var(--tm)"></span>
        </div>
      </div>
      <div class="steps" id="steps"></div>
      <div class="cards" id="cards"></div>
      <div class="empty" id="meta" style="margin-top:8px"></div>
      <div class="bar" style="margin:10px 0 0">
        <button id="stopBtn" style="color:var(--dn-tx)">зупинити прогін</button>
        <a href="/start" style="font-size:13px;color:var(--acc-tx)">почати новий прогін →</a>
        <span id="actionMsg" class="empty"></span>
      </div>
    </div>

    <div class="panel">
      <div class="bar" style="margin-bottom:8px">
        <span style="font-size:13px;font-weight:500">ролі й виклики моделі</span>
        <span class="empty" id="callsMeta"></span>
      </div>
      <div id="calls"></div>
    </div>

    <div class="panel">
      <div class="bar" style="margin-bottom:8px">
        <span style="font-size:13px;font-weight:500">журнал кроків</span>
        <span class="empty">запит і відповідь кожної ролі · так само, як у терміналі</span>
        <button id="follow" style="margin-left:auto" aria-pressed="true">тримаюсь хвоста</button>
      </div>
      <pre class="log" id="log">журнал порожній</pre>
    </div>
  </div>
</div>

<script src="/app.js"></script>
<script>
(function () {
  'use strict';
  var B = window.BDO;
  B.renderNav('/');
  if (!B.ensureToken()) { return; }
  B.el('app').style.display = 'block';

  var lastCallsKey = '';
  var journal = B.follow(B.el('log'), B.el('follow'));

  // Живий друк іде через рівномірний буфер (`B.typer`), а не малюється порціями
  // так, як прилетіло: сервер читає журнал токенів тактами, тому за раз
  // приходить десяток символів, і без буфера друк смикає.
  var stream = B.typer(null, { onPaint: paintStream });
  // Сире СИРЕ тримаємо окремо: ролі відповідають під strict-схемою, тому модель
  // друкує JSON, і на екран іде лише те, що в ньому має сенс для людини
  // (`B.readable`). Без цього власник бачив `ext":"[Доса] Оберіть свій…` ·
  // переклад упереміш зі службовими лапками (виявлено на живому прогоні
  // 2026-09-06). Темп друку рахується вже по ЛЮДСЬКОМУ тексту.
  var rawStream = '';

  // Кожен крок має ПІДПИС станом. Сірий колір без слова змушував гадати, що
  // сталося з ремонтом · саме це власник і запитав 2026-09-05.
  var STEP_WORDS = {
    done: 'зроблено',
    now: 'іде зараз',
    skipped: 'не знадобився',
    pending: 'попереду'
  };

  // Малюємо ТЕКСТОМ, а не розміткою: `innerHTML` на кожен кадр змушував браузер
  // щоразу заново розбирати рядок, і саме це додавало ривків.
  function paintStream(text) {
    var box = B.el('streambox');
    if (!box) { return; }
    if (!text) { box.style.display = 'none'; return; }
    box.style.display = 'block';
    var body = box.firstChild;
    if (!body || body.nodeType !== 3) {
      box.textContent = '';
      body = document.createTextNode('');
      box.appendChild(body);
      var caret = document.createElement('span');
      caret.className = 'caret';
      box.appendChild(caret);
    }
    body.nodeValue = text.length > 4000 ? text.slice(-4000) : text;
    box.scrollTop = box.scrollHeight;
  }

  function render(s) {
    var target = (s.env || '').toUpperCase() || '—';
    var envEl = B.el('env');
    envEl.textContent = target;
    envEl.style.background = target === 'PROD' ? 'var(--dn-bg)' : 'var(--s2)';
    envEl.style.color = target === 'PROD' ? 'var(--dn-tx)' : 'var(--ts)';

    var b = s.batch || {};
    if (b.id) {
      var bits = [b.id];
      if (b.patch) { bits.push(b.patch === 'active' ? 'активний патч' : 'патч ' + b.patch); }
      bits.push(B.num(b.rows) + ' рядків');
      if (b.domain) { bits.push(b.domain); }
      B.el('batch').textContent = bits.join(' · ');
      B.el('statePhrase').textContent = b.state_phrase || b.state_label || '—';
    } else {
      B.el('batch').textContent = '';
      B.el('statePhrase').textContent = 'пачки немає · сторінка чекає';
    }
    var goal = B.el('goal');
    goal.textContent = (s.goal && s.goal.phrase) ? s.goal.phrase : 'ціль прогону не зафіксована';
    // Сам запит до API лишається в підказці: він потрібен при розборі, але на
    // екрані власника мусить стояти те, що робиться, а не як відібрано рядки.
    goal.title = (s.goal && s.goal.query) ? 'вибірка: ' + s.goal.query : '';

    B.el('steps').innerHTML = (s.steps || []).map(function (st) {
      var state = st.state || 'pending';
      return '<div class="step ' + state + '">'
        + '<span class="n">' + B.esc(st.label) + '</span>'
        + '<span class="s">' + B.esc(STEP_WORDS[state] || state) + '</span></div>';
    }).join('');

    var sum = s.summary || {};
    var callsView = s.calls || { scope: 'session', items: [] };
    var calls = callsView.items || [];
    var cards = [
      ['у шар', sum.to_layer, 'var(--ok-tx)'],
      ['до людини', sum.to_human, ''],
      ['карантин', sum.quarantine, (sum.quarantine ? 'var(--dn-tx)' : '')],
      ['викликів моделі', calls.length, '']
    ];
    B.el('cards').innerHTML = cards.map(function (c) {
      var v = (c[1] === undefined || c[1] === null) ? '—' : B.num(c[1]);
      return '<div class="card"><div class="l">' + B.esc(c[0]) + '</div>'
        + '<div class="v"' + (c[2] ? ' style="color:' + c[2] + '"' : '') + '>' + v + '</div></div>';
    }).join('');

    var meta = [];
    meta.push(s.running ? 'прогін іде' : 'прогін не йде');
    if (b.updated_ago) { meta.push('останній рух ' + b.updated_ago); }
    if (s.session && s.session.id) { meta.push('сесія ' + s.session.id + ' · пачок ' + B.num(s.session.batches)); }
    if (s.remaining !== null && s.remaining !== undefined) { meta.push('лишилось рядків ' + B.num(s.remaining)); }
    B.el('meta').textContent = meta.join(' | ');
    B.el('stopBtn').disabled = !s.running;

    var key = calls.map(function (c) { return c.at + c.role + c.verdict + c.ms; }).join('|');
    var live = (s.stream && s.stream.role_label && s.stream.fresh) ? s.stream.role_label : '';
    if (key !== lastCallsKey || (live && !B.el('streambox'))) {
      lastCallsKey = key;
      var html = calls.length ? calls.map(function (c) {
        var okColor = c.verdict === 'ok' ? 'var(--ok-tx)' : 'var(--dn-tx)';
        var bits = [];
        // Скільки рядків пішло в модель · без цього «53 с» не має знаменника:
        // незрозуміло, це один важкий рядок чи десять легких.
        if (c.rows) { bits.push(B.num(c.rows) + ' ' + (c.rows === 1 ? 'рядок' : 'рядків')); }
        if (c.in || c.out) { bits.push(B.num(c.in) + '→' + B.num(c.out) + ' ток.'); }
        // Вага самого payload · це «навантаження JSON», яке готує рушій.
        // Токени рахуються ПІСЛЯ підміни хешів на короткі ключі, тому два
        // числа поруч показують, скільки важать службові поля.
        if (c.payload_bytes) { bits.push(Math.round(c.payload_bytes / 1024) + ' КБ payload'); }
        if (c.ms) { bits.push(B.secs(c.ms)); }
        if (c.think) { bits.push('роздуми'); }
        return '<div class="msg"><div class="mh">'
          + '<span style="font-weight:500">' + B.esc(c.role_label) + '</span>'
          + '<span class="meta">' + B.esc(bits.join(' · ')) + '</span>'
          + '<span style="margin-left:auto;font-size:12px;color:' + okColor + '">' + B.esc(c.verdict || '—') + '</span>'
          + '<span class="meta" style="margin-left:8px">' + B.esc(c.hms) + '</span></div></div>';
      }).join('') : '<div class="empty">' + B.esc(callsView.reason || 'викликів немає') + '</div>';
      // Роль, яка друкує ЗАРАЗ, ще не має рядка в журналі викликів: він
      // пишеться ПІСЛЯ відповіді. Тому її картка малюється окремо.
      if (live && s.running) {
        // ЩО САМЕ ЗАРАЗ · «друкує…» лише коли справді йдуть символи.
        //
        // Ollama вивантажує вагу за налаштуванням машини (у власника 5 хвилин),
        // і перший виклик після паузи спершу вантажить 23 ГБ. На живому прогоні
        // це дало 960 секунд повного мовчання · виглядало як «зависло».
        var waiting = (s.stream && s.stream.waiting) || 0;
        var loading = waiting >= 12;
        html += '<div class="msg active"><div class="mh">'
          + '<span style="font-weight:500;color:var(--acc-tx)">' + B.esc(live) + '</span>'
          + '<span class="meta">' + (loading
              ? 'модель вантажиться, ' + waiting + ' с · перший виклик після паузи тягне вагу з диска'
              : 'друкує…') + '</span></div>'
          + (loading
              ? '<div class="empty" style="margin-top:6px">Це не зависання: Ollama вивантажує модель за своїм '
                + 'налаштуванням, і наступні виклики підуть без цієї паузи.</div>'
              : '')
          + '<div class="box mono" id="streambox"></div></div>';
      }
      B.el('calls').innerHTML = html;
      B.el('callsMeta').textContent = !calls.length ? ''
        : (callsView.scope === 'batch'
            ? 'пачки ' + callsView.batch + ' · ' + calls.length
            : 'цієї сесії · ' + calls.length + ' (пачку не вказано)');
      paintStream(stream.text());
    }

    // Знімок стану знає ПОВНИЙ текст ролі · він і є джерелом правди, коли
    // сторінку щойно відкрили або потік на мить обірвався. Буфер сам добере
    // різницю, а не перемалює все стрибком.
    if (s.stream && typeof s.stream.text === 'string' && s.stream.text !== '') {
      rawStream = s.stream.text;
      stream.sync(B.readable(rawStream));
    }
    // Роль договорила · тягнути залишок буфера нема сенсу.
    if (!live || !s.running) { stream.flush(); }
    journal.write((s.transcript || []).join('\n') || 'журнал порожній');
  }

  B.live(render, function (d) {
    if (d.restarted) { rawStream = ''; stream.reset(); }
    rawStream += d.text || '';
    if (rawStream.length > 24000) { rawStream = rawStream.slice(-16000); }
    stream.sync(B.readable(rawStream));
  });

  B.el('stopBtn').onclick = function () {
    var msg = B.el('actionMsg');
    msg.textContent = 'зупиняю…';
    B.post('/api/action', { action: 'run.stop' }).then(function (res) {
      msg.textContent = res.status >= 400
        ? (res.body && res.body.hint ? res.body.hint : 'відмова, код ' + res.status)
        : 'прогін зупинено';
      msg.style.color = res.status >= 400 ? 'var(--dn-tx)' : 'var(--ok-tx)';
    });
  };
})();
</script>
</body>
</html>
