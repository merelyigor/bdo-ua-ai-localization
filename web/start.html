<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>bdo · почати прогін</title>
<link rel="stylesheet" href="/app.css">
<!--
  ЕКРАН СТАРТУ · за макетом `docs/prototypes/04-start.html`.

  Три речі, яких бракувало в першій редакції й на які власник вказав прямо:
  патч вибирається СЕЛЕКТОМ із живими числами (а не вводиться рядком), режим
  пояснює НАСЛІДОК (куди піде запис), а попередній показ команди приходить із
  сервера · щоб він не міг розійтися з тим, що виконається.
-->
</head>
<body>
<div class="wrap">
  <div class="nav" id="nav"></div>
  <div id="gate" class="panel" style="display:none"></div>

  <div id="app" style="display:none">
    <div class="screen-title">
      <h1>Почати прогін</h1>
      <span class="hint">кнопка виконує ті самі команди, що й термінал</span>
    </div>

    <div class="panel">
      <div class="head">
        <div class="row">
          <span class="lbl">куди пишемо</span>
          <span class="pill" id="env">—</span>
          <span class="empty" id="running"></span>
        </div>
      </div>

      <div class="bar" style="margin-bottom:4px"><span class="lbl">режим</span></div>
      <div class="bar" id="modes" style="align-items:stretch"></div>

      <div class="bar" style="margin:12px 0 4px"><span class="lbl">патч</span></div>
      <!-- ТАБЛИЦЯ, А НЕ ВИПАДАЙКА (прототип 04). У випадайці не видно, ДЕ
           взагалі є робота: власник читає «без ШІ-шару» по всіх патчах одразу
           й вибирає за числом, а не наосліп. Вибір лишається одним кліком. -->
      <table class="tbl pick" id="patchTable">
        <thead><tr><th>патч</th><th>№ у грі</th><th>опубліковано</th>
          <th class="num">рядків</th><th class="num">без ШІ-шару</th><th></th></tr></thead>
        <tbody id="patchRows"></tbody>
      </table>
      <div class="bar" style="margin-top:10px">
        <label class="empty" for="domain">категорія</label>
        <select id="domain"><option value="">усі</option></select>
        <label class="empty" for="batches">пачок</label>
        <input id="batches" type="number" min="1" max="200" value="1" style="width:80px">
      </div>
      <div class="empty" id="patchHint" style="margin-top:6px"></div>

      <div class="bar" style="margin:12px 0 4px"><span class="lbl">роздуми</span></div>
      <label class="sw">
        <input type="checkbox" id="think"><span class="track"></span>
        <span>Дозволити моделі думати вголос перед відповіддю
          <span class="empty">· якість інколи вища, час приблизно вшестеро довший (7.6 с проти 44.8 с на тому самому запиті)</span></span>
      </label>

      <div class="bar" style="margin:12px 0 4px"><span class="lbl">що запуститься</span></div>
      <div class="box mono" id="preview" style="margin-top:0">—</div>

      <!-- Підтвердження PROD · перемикач із іншим кольором: це не налаштування,
           а згода на незворотний запис, і вона мусить виглядати інакше. -->
      <label class="sw danger" style="margin:12px 0 8px">
        <input type="checkbox" id="confirm"><span class="track"></span>
        <span>Запис піде в <b id="confirmEnv" style="font-weight:500">PROD</b>, і це незворотно. Розумію.</span>
      </label>
      <div class="bar">
        <button id="startBtn">почати прогін</button>
        <span id="actionMsg" class="empty"></span>
        <button id="logToggle" style="display:none;margin-left:auto">показати вивід</button>
      </div>
      <pre class="log" id="actionLog" style="display:none;max-height:240px;margin-top:8px"></pre>
    </div>
  </div>
</div>

<script src="/app.js"></script>
<script>
(function () {
  'use strict';
  var B = window.BDO;
  B.renderNav('/start');
  if (!B.ensureToken()) { return; }
  B.el('app').style.display = 'block';

  // Наслідок режиму · головне, чого бракувало: кнопки міняли рядок команди й
  // більше нічого, тому було незрозуміло, що взагалі перемикається.
  var MODE_INFO = {
    patch: { name: 'патч', what: 'перекласти рядки без ШІ-шару', where: 'запис у ШІ-шар' },
    improve: { name: 'покращення ШІ', what: 'другий прохід по вже машинних', where: 'запис у ШІ-шар' },
    proposal: { name: 'пропозиції', what: 'усе віддати людині', where: 'черга до людини' },
    manual: { name: 'ручний', what: 'вузький набір під підтвердження', where: 'ручний шар і черга' }
  };
  // Памʼять вибору · режим, патч, категорія, кількість пачок і роздуми.
  // Підтвердження PROD сюди НЕ входить навмисно: це згода на незворотний
  // запис, і давати її треба щоразу заново.
  var P = B.pref('start');
  var mode = P.get('mode', 'patch');
  var patches = [];

  var chosenPatch = String(P.get('patch', 'active'));
  function selectedPatch() { return chosenPatch || 'active'; }

  function renderModes() {
    B.el('modes').innerHTML = Object.keys(MODE_INFO).map(function (key) {
      var m = MODE_INFO[key];
      return '<button class="mode" data-mode="' + key + '" aria-pressed="' + (key === mode) + '">'
        + '<span class="n">' + B.esc(m.name) + '</span>'
        + '<span class="d">' + B.esc(m.what) + '</span>'
        + '<span class="d">→ ' + B.esc(m.where) + '</span></button>';
    }).join('');
    Array.prototype.forEach.call(B.el('modes').querySelectorAll('.mode'), function (btn) {
      btn.onclick = function () {
        mode = btn.getAttribute('data-mode');
        P.set('mode', mode);
        renderModes();
        refresh();
      };
    });
  }

  function renderPatches() {
    var rows = '<tr data-patch="active"' + (chosenPatch === 'active' ? ' class="on"' : '') + '>'
      + '<td>активний</td><td>—</td><td>—</td><td class="num">—</td><td class="num">—</td>'
      + '<td class="empty">той, що зараз у грі</td></tr>';
    rows += patches.map(function (p) {
      var left = Number(p.missing_machine) || 0;
      return '<tr data-patch="' + B.esc(p.patch) + '"'
        + (String(chosenPatch) === String(p.patch) ? ' class="on"' : '') + '>'
        + '<td>' + B.esc(p.patch) + '</td>'
        + '<td class="empty">' + B.esc(p.game_number || '—') + '</td>'
        + '<td class="empty">' + B.esc(p.published || '—') + '</td>'
        + '<td class="num">' + B.num(p.rows) + '</td>'
        // Нуль без роботи гасимо: рядок «0» серед тисяч читається як помилка,
        // хоча означає «тут уже все зроблено».
        + '<td class="num"' + (left ? ' style="color:var(--ok-tx)"' : ' class="num empty"') + '>'
        + (left ? B.num(left) : '—') + '</td>'
        + '<td class="empty">' + (p.active ? 'активний' : '') + '</td></tr>';
    }).join('');
    B.el('patchRows').innerHTML = rows;
    Array.prototype.forEach.call(B.el('patchRows').querySelectorAll('tr'), function (tr) {
      tr.onclick = function () {
        chosenPatch = tr.dataset.patch;
        P.set('patch', chosenPatch);
        renderPatches();
        patchHint();
        refresh();
      };
    });
  }

  function patchHint() {
    var value = selectedPatch();
    var found = null;
    patches.forEach(function (p) { if (String(p.patch) === value) { found = p; } });
    if (!found) {
      B.el('patchHint').textContent = patches.length
        ? '«Неактивний» не означає «неактуальний»: більшість роботи живе в старих патчах.'
        : 'перелік патчів вантажиться…';
      return;
    }
    var batches = Math.max(1, Math.ceil(found.missing_machine / 50));
    B.el('patchHint').textContent = 'у патчі ' + found.patch + ' лишилось ' + B.num(found.missing_machine)
      + ' рядків без ШІ-шару · це приблизно ' + B.num(batches) + ' пачок по 50';
  }

  function payload() {
    var p = { mode: mode, patch: selectedPatch() };
    var domain = B.el('domain').value;
    if (domain) { p.domain = domain; }
    var batches = B.el('batches').value;
    if (batches) { p.batches = batches; }
    if (B.el('think').checked) { p.think = true; }
    return p;
  }

  var previewTimer = null;
  function refresh() {
    patchHint();
    if (previewTimer) { clearTimeout(previewTimer); }
    previewTimer = setTimeout(function () {
      B.get('/api/plan?action=run.start&payload=' + encodeURIComponent(JSON.stringify(payload())))
        .then(function (d) {
          B.el('preview').textContent = (d.commands || []).join('\n') || (d.hint || '—');
        })
        .catch(function () { B.el('preview').textContent = 'сервер не відповів · план невідомий'; });
    }, 150);
  }

  // Відновлюємо збережене ДО першого показу команди, інакше перший рендер
  // покаже одне, а памʼять · інше.
  ['domain', 'batches', 'think'].forEach(function (id) {
    var node = B.el(id);
    var saved = P.get(id, null);
    if (saved === null) { return; }
    if (node.type === 'checkbox') { node.checked = !!saved; } else { node.value = saved; }
  });
  ['domain', 'batches', 'think'].forEach(function (id) {
    var node = B.el(id);
    node.addEventListener('change', function () {
      P.set(id, node.type === 'checkbox' ? node.checked : node.value);
    });
  });
  ['domain', 'batches', 'think'].forEach(function (id) {
    B.el(id).onchange = refresh;
    B.el(id).oninput = refresh;
  });

  B.get('/api/actions').then(function (d) {
    B.el('domain').innerHTML = '<option value="">усі</option>'
      + (d.domains || []).map(function (x) { return '<option>' + B.esc(x) + '</option>'; }).join('');
  }).catch(function () {});

  // Патчі їдуть із API · без ознаки роботи порожня таблиця читається як
  // «патчів немає».
  B.el('patchRows').innerHTML = '<tr><td colspan="6">'
    + B.loadingHtml('беру перелік патчів з API…') + '</td></tr>';
  B.get('/api/patches').then(function (d) {
    patches = d.patches || [];
    renderPatches();
    refresh();
  }).catch(function () {
    B.el('patchHint').textContent = 'перелік патчів не завантажився · патч можна лишити «активний»';
  });

  B.get('/api/state').then(function (s) {
    var target = (s.env || '').toUpperCase() || '—';
    B.el('env').textContent = target;
    B.el('env').style.background = target === 'PROD' ? 'var(--dn-bg)' : 'var(--s2)';
    B.el('env').style.color = target === 'PROD' ? 'var(--dn-tx)' : 'var(--ts)';
    B.el('confirmEnv').textContent = target;
    if (s.running) {
      B.el('running').textContent = 'прогін уже йде · старт заблокований';
      B.el('startBtn').disabled = true;
    }
    B.setLink('live');
  }).catch(function (e) {
    if (e && e.message === 'bad_token') { B.tokenRejected(); }
  });

  B.el('logToggle').onclick = function () {
    var log = B.el('actionLog');
    var short = log.textContent === log.dataset.short;
    log.textContent = short ? log.dataset.full : log.dataset.short;
    this.textContent = short ? 'згорнути вивід' : 'показати вивід';
  };

  B.el('startBtn').onclick = function () {
    var msg = B.el('actionMsg');
    if (!B.el('confirm').checked) {
      msg.textContent = 'спершу підтверди запис у ' + B.el('confirmEnv').textContent;
      msg.style.color = 'var(--dn-tx)';
      return;
    }
    msg.textContent = 'запускаю…';
    msg.style.color = 'var(--ts)';
    B.post('/api/action', { action: 'run.start', payload: payload(), confirm: true }).then(function (res) {
      var steps = (res.body && res.body.steps) || [];
      var log = B.el('actionLog');
      if (res.status >= 400 && !steps.length) {
        msg.textContent = (res.body && res.body.hint) ? res.body.hint : 'відмова, код ' + res.status;
        msg.style.color = 'var(--dn-tx)';
        return;
      }
      log.dataset.full = steps.map(function (s) {
        return '$ ' + s.command + '  → код ' + s.code + (s.output ? '\n' + s.output : '');
      }).join('\n\n');
      log.dataset.short = steps.map(function (s) { return '$ ' + s.command + '  → код ' + s.code; }).join('\n');
      log.textContent = log.dataset.short;
      log.style.display = 'block';
      B.el('logToggle').style.display = '';
      B.el('logToggle').textContent = 'показати вивід';
      if (res.body && res.body.ok) {
        msg.innerHTML = 'прогін запущено · <a href="/" style="color:var(--acc-tx)">дивитись роботу →</a>';
        msg.style.color = 'var(--ok-tx)';
      } else {
        msg.textContent = 'крок не вдався · дивись вивід';
        msg.style.color = 'var(--dn-tx)';
      }
    });
  };

  renderModes();
  refresh();
})();
</script>
</body>
</html>
